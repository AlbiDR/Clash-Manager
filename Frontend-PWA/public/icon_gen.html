<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Icon Previewer | Clash Manager</title>
    <style>
      :root {
        --bg: #0b0e14;
        --surf: #1b1f27;
        --text: #e1e2e8;
        --border: #2f343e;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }
      .title {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        opacity: 0.4;
        margin-bottom: 40px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 60px;
        padding: 40px;
      }
      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }
      .container {
        width: 192px;
        height: 192px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        border: 1px solid var(--border);
        position: relative;
        overflow: hidden;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      }
      .logo {
        width: 96px;
        height: 96px;
        object-fit: contain;
      }

      /* Variant: Maskable (Adaptive background) */
      .maskable {
        border-radius: 0;
        background: #0b0e14;
      }

      /* Variant: Monochrome (Filter logic) */
      .monochrome {
        background: transparent;
        border: 1px dashed #5f6368;
      }
      .monochrome .logo {
        filter: brightness(0) invert(1);
      }

      .label {
        font-size: 13px;
        font-weight: 700;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <div class="title">Clash Manager Asset Manifest Preview</div>
    <div class="grid">
      <div class="card">
        <span class="label">Regular</span>
        <div class="container">
          <img src="logo.svg" class="logo" alt="Regular" />
        </div>
      </div>
      <div class="card">
        <span class="label">Maskable</span>
        <div class="container maskable">
          <img src="logo.svg" class="logo" alt="Maskable" />
        </div>
      </div>
      <div class="card">
        <span class="label">Monochrome</span>
        <div class="container monochrome">
          <img src="logo.svg" class="logo" alt="Monochrome" />
        </div>
      </div>
    </div>
  </body>
</html>
