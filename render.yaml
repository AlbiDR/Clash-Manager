services:
  - type: web
    name: clash-manager-worker
    runtime: node
    plan: free
    buildCommand: pnpm install && pnpm --filter clash-manager-worker run build
    startCommand: node Backend-Worker/dist/Backend-Worker/src/index.js
    envVars:
      - key: WORKER_CONCURRENCY
        value: "20"
      - key: WORKER_TIMEOUT_SEC
        value: "45"
      - key: PORT
        value: "10000"
      - key: NODE_VERSION
        value: "24"

