project_id = "hucktamloykszinwbtuh"

[api]
port = 54321
# [2026-08-26 audit] Was ["public", "substrate", "drivers", "features"]. That
# never matched the remote project, which only exposes the four schemas below
# (see 20260817000000_expose_pwa_client_surfaces.sql) -- substrate and drivers
# are internal-only, reached exclusively through features views/RPCs. This
# setting only configures the local dev stack; it does not change what the
# remote project actually exposes, but keeping it accurate is what would have
# caught the PGRST106 failures (dead heartbeat freshness, empty blacklist,
# lost push subscriptions) locally instead of silently in production.
schemas = ["public", "storage", "graphql_public", "features"]

[db]
port = 54322

[functions.ingest-royale-data]
verify_jwt = false

[functions.query-royale-api]
verify_jwt = false

[functions.ping]
verify_jwt = false

[functions.fetch-player-battlelog]
verify_jwt = false

[functions.headhunter-scanner]
# Authenticates via its own INTERNAL_BEARER_TOKEN (clinicalServe guard), used by both
# the pg_cron epoch guard and the manual GitHub workflow. The gateway must NOT enforce a
# Supabase JWT, or those custom-bearer calls are rejected with UNAUTHORIZED_INVALID_JWT_FORMAT.
verify_jwt = false
