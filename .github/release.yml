changelog:
  exclude:
    labels:
      - ignore
      - skip-changelog
    authors:
      - dependabot
      - github-actions
  categories:
    - title: ✨ Features & Enhancements
      labels:
        - feat
        - feature
        - enhancement
      # Automatically matches commits starting with feat:, feature:, add:, new:
      commits:
        patterns:
          - '^feat(\(.+\))?:'
          - '^feature(\(.+\))?:'
          - '^add(\(.+\))?:'
          - '^new(\(.+\))?:'
          - '^[Aa]dds?\s'
          - '^[Aa]dded\s'
          - '^[Cc]reates?\s'
          - '^[Cc]reated\s'
          - '^[Ee]nhances?\s'
          - '^[Ee]nhanced\s'
          - '^[Ii]mproves?\s'
          - '^[Ii]mproved\s'
          - '^[Ii]mplements?\s'
          - '^[Ii]mplemented\s'
    
    - title: 🐛 Bug Fixes
      labels:
        - fix
        - bug
        - bugfix
      commits:
        patterns:
          - '^fix(\(.+\))?:'
          - '^bug(\(.+\))?:'
          - '^bugfix(\(.+\))?:'
          - '^[Ff]ixes?\s'
          - '^[Ff]ixed\s'
          - '^[Rr]esolves?\s'
          - '^[Rr]esolved\s'
          - '^[Cc]orrects?\s'
          - '^[Cc]orrected\s'
          - '^[Pp]atches?\s'
          - '^[Pp]atched\s'
    
    - title: 🔧 Refactors & Code Quality
      labels:
        - refactor
        - perf
        - style
        - clean
      commits:
        patterns:
          - '^refactor(\(.+\))?:'
          - '^perf(\(.+\))?:'
          - '^style(\(.+\))?:'
          - '^clean(\(.+\))?:'
          - '^[Rr]efactors?\s'
          - '^[Rr]efactored\s'
          - '^[Cc]leans?\s'
          - '^[Cc]leaned\s'
          - '^[Oo]ptimizes?\s'
          - '^[Oo]ptimized\s'
    
    - title: 📦 Dependencies
      labels:
        - deps
        - dependencies
      commits:
        patterns:
          - '^deps(\(.+\))?:'
          - '^build(\(.+\))?:'
          - '^[Uu]pdates?\s.*dependen'
          - '^[Uu]pdated\s.*dependen'
          - '^[Bb]umps?\s'
          - '^[Bb]umped\s'
    
    - title: 📝 Documentation
      labels:
        - docs
        - documentation
      commits:
        patterns:
          - '^docs(\(.+\))?:'
          - '^documentation(\(.+\))?:'
          - '^[Uu]pdates?\s.*README'
          - '^[Uu]pdates?\s.*docs?'
          - '^[Uu]pdated\s.*docs?'
    
    - title: 🔨 CI/CD & Build
      labels:
        - ci
        - build
        - workflow
      commits:
        patterns:
          - '^ci(\(.+\))?:'
          - '^build(\(.+\))?:'
          - '^workflow(\(.+\))?:'
          - '^[Uu]pdates?\s.*workflow'
          - '^[Uu]pdated\s.*workflow'
          - '^[Ii]mproves?\s.*release'
    
    - title: 🗒️ Other Changes
      labels:
        - "*"
