name: Sync Branches

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  full-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git User
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Fetch all branches
        run: git fetch origin

      - name: Forward Sync (Jules -> Beta -> Stable)
        run: |
          # 1. Jules -> Beta
          echo "==== SYNC: Jules -> Beta ===="
          if git show-ref --verify --quiet refs/remotes/origin/Beta; then
            git checkout Beta
            git pull origin Beta
          else
            git checkout -b Beta origin/Jules
            git push origin Beta
          fi
          git merge origin/Jules --no-edit
          git push origin Beta

          # 2. Beta -> Stable
          echo "==== SYNC: Beta -> Stable ===="
          git checkout Stable
          git pull origin Stable
          git merge Beta --no-edit
          git push origin Stable

      - name: Reverse Sync (Stable -> Beta -> Jules)
        run: |
          # 1. Stable -> Beta
          echo "==== SYNC: Stable -> Beta ===="
          git checkout Beta
          git pull origin Beta
          git merge origin/Stable --no-edit
          git push origin Beta

          # 2. Beta -> Jules
          echo "==== SYNC: Beta -> Jules ===="
          git checkout Jules
          git pull origin Jules
          git merge Beta --no-edit
          git push origin Jules

      - name: Final Status
        run: |
          echo "Successfully completed full round-trip synchronization."
          echo "Path: Jules <-> Beta <-> Stable"
