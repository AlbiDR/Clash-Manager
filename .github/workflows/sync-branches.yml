name: Sync Branches

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  full-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git User
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Initialize Flags
        run: |
          echo "PWA_CHANGED=false" >> $GITHUB_ENV
          echo "GAS_CHANGED=false" >> $GITHUB_ENV

      - name: Fetch all branches
        run: git fetch origin

      - name: Forward Sync (Jules -> Beta -> Stable)
        run: |
          # 1. Jules -> Beta
          echo "==== SYNC: Jules -> Beta ===="
          if git show-ref --verify --quiet refs/remotes/origin/Beta; then
            git checkout Beta
            git pull origin Beta
          else
            git checkout -b Beta origin/Jules
            git push origin Beta
          fi
          git merge origin/Jules --no-edit
          git push origin Beta

          # 2. Beta -> Stable
          echo "==== SYNC: Beta -> Stable ===="
          git checkout Stable
          git pull origin Stable

          BEFORE_SHA=$(git rev-parse HEAD)
          git merge Beta --no-edit
          AFTER_SHA=$(git rev-parse HEAD)

          if [ "$BEFORE_SHA" != "$AFTER_SHA" ]; then
            git push origin Stable
            if git diff --name-only $BEFORE_SHA $AFTER_SHA | grep -E "^Frontend-PWA/|^\.github/workflows/deploy-pwa\.yml" > /dev/null; then
              echo "PWA_CHANGED=true" >> $GITHUB_ENV
            fi
            if git diff --name-only $BEFORE_SHA $AFTER_SHA | grep -E "^Backend-GAS/" > /dev/null; then
              echo "GAS_CHANGED=true" >> $GITHUB_ENV
            fi
          fi

      - name: Trigger Deployments
        if: env.PWA_CHANGED == 'true' || env.GAS_CHANGED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ env.PWA_CHANGED }}" == "true" ]; then
            echo "🚀 Triggering PWA Deployment..."
            gh workflow run deploy-pwa.yml --ref Stable
          fi
          if [ "${{ env.GAS_CHANGED }}" == "true" ]; then
            echo "🚀 Triggering GAS Deployment..."
            gh workflow run deploy-gas.yml --ref Stable
          fi

      - name: Reverse Sync (Stable -> Beta -> Jules)
        run: |
          # 1. Stable -> Beta
          echo "==== SYNC: Stable -> Beta ===="
          git checkout Beta
          git pull origin Beta
          git merge origin/Stable --no-edit
          git push origin Beta

          # 2. Beta -> Jules
          echo "==== SYNC: Beta -> Jules ===="
          git checkout Jules
          git pull origin Jules
          git merge Beta --no-edit
          git push origin Jules

      - name: Final Status
        run: |
          echo "Successfully completed full round-trip synchronization."
          echo "Path: Jules <-> Beta <-> Stable"
