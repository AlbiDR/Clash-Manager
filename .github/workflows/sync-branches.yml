name: Sync Branches

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# ============================================================================
# JOB 0: Pre-sync Check
# ============================================================================
jobs:
  check-sync:
    name: "Initial Difference Detection"
    runs-on: ubuntu-latest
    outputs:
      nightly_beta_diff: ${{ steps.check.outputs.nightly_beta_diff }}
      beta_stable_diff: ${{ steps.check.outputs.beta_stable_diff }}
      stable_beta_diff: ${{ steps.check.outputs.stable_beta_diff }}
      beta_nightly_diff: ${{ steps.check.outputs.beta_nightly_diff }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for differences
        id: check
        run: |
          git fetch origin

          # Nightly -> Beta
          if git merge-base --is-ancestor origin/Nightly origin/Beta; then
            echo "nightly_beta_diff=false" >> $GITHUB_OUTPUT
          else
            echo "nightly_beta_diff=true" >> $GITHUB_OUTPUT
          fi

          # Beta -> Stable
          if git merge-base --is-ancestor origin/Beta origin/Stable; then
            echo "beta_stable_diff=false" >> $GITHUB_OUTPUT
          else
            echo "beta_stable_diff=true" >> $GITHUB_OUTPUT
          fi

          # Stable -> Beta
          if git merge-base --is-ancestor origin/Stable origin/Beta; then
            echo "stable_beta_diff=false" >> $GITHUB_OUTPUT
          else
            echo "stable_beta_diff=true" >> $GITHUB_OUTPUT
          fi

          # Beta -> Nightly
          if git merge-base --is-ancestor origin/Beta origin/Nightly; then
            echo "beta_nightly_diff=false" >> $GITHUB_OUTPUT
          else
            echo "beta_nightly_diff=true" >> $GITHUB_OUTPUT
          fi

  # ============================================================================
  # JOB 1: (Upstream) Nightly → Beta
  # ============================================================================
  nightly-to-beta:
    name: "(Upstream) Nightly → Beta"
    needs: check-sync
    if: needs.check-sync.outputs.nightly_beta_diff == 'true'
    runs-on: ubuntu-latest
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git User
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Fetch all branches
        run: git fetch origin

      - name: Merge Nightly into Beta
        id: merge
        run: |
          git checkout Beta
          git pull origin Beta
          git merge origin/Nightly --no-edit
          git push origin Beta
          echo "merged=true" >> $GITHUB_OUTPUT

  # ============================================================================
  # JOB 2: (Upstream) Beta → Stable
  # ============================================================================
  beta-to-stable:
    name: "(Upstream) Beta → Stable"
    needs: [check-sync, nightly-to-beta]
    if: |
      always() &&
      (needs.check-sync.outputs.beta_stable_diff == 'true' || needs.nightly-to-beta.outputs.merged == 'true') &&
      (needs.nightly-to-beta.result == 'success' || needs.nightly-to-beta.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
      pwa_changed: ${{ steps.detect.outputs.pwa_changed }}
      gas_changed: ${{ steps.detect.outputs.gas_changed }}
      worker_changed: ${{ steps.detect.outputs.worker_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git User
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Fetch all branches
        run: git fetch origin

      - name: Merge Beta into Stable
        id: merge
        run: |
          git checkout Stable
          git pull origin Stable

          BEFORE_SHA=$(git rev-parse HEAD)
          git merge origin/Beta --no-edit
          AFTER_SHA=$(git rev-parse HEAD)

          echo "before_sha=$BEFORE_SHA" >> $GITHUB_OUTPUT
          echo "after_sha=$AFTER_SHA" >> $GITHUB_OUTPUT

          if [ "$BEFORE_SHA" != "$AFTER_SHA" ]; then
            git push origin Stable
            echo "merged=true" >> $GITHUB_OUTPUT
          else
            echo "merged=false" >> $GITHUB_OUTPUT
          fi

      - name: Detect Changed Files
        id: detect
        run: |
          if [ "${{ steps.merge.outputs.merged }}" == "true" ]; then
            BEFORE=${{ steps.merge.outputs.before_sha }}
            AFTER=${{ steps.merge.outputs.after_sha }}

            # PWA: Frontend-PWA/** or deploy-pwa.yml, excluding .md files
            if git diff --name-only $BEFORE $AFTER | grep -E "^Frontend-PWA/|^\.github/workflows/deploy-pwa\.yml" | grep -v "\.md$" > /dev/null; then
              echo "pwa_changed=true" >> $GITHUB_OUTPUT
            else
              echo "pwa_changed=false" >> $GITHUB_OUTPUT
            fi

            # GAS: Only actual GAS scripts (*.gs.js and appsscript.json)
            if git diff --name-only $BEFORE $AFTER | grep -E "^Backend-GAS/.*\.gs\.js$|^Backend-GAS/appsscript\.json$" > /dev/null; then
              echo "gas_changed=true" >> $GITHUB_OUTPUT
            else
              echo "gas_changed=false" >> $GITHUB_OUTPUT
            fi

            # Worker: Backend-Worker/** or deploy-worker.yml
            if git diff --name-only $BEFORE $AFTER | grep -E "^Backend-Worker/|^\.github/workflows/deploy-worker\.yml" > /dev/null; then
              echo "worker_changed=true" >> $GITHUB_OUTPUT
            else
              echo "worker_changed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "pwa_changed=false" >> $GITHUB_OUTPUT
            echo "gas_changed=false" >> $GITHUB_OUTPUT
            echo "worker_changed=false" >> $GITHUB_OUTPUT
          fi

  # ============================================================================
  # JOB 3: (Downstream) Stable → Beta
  # ============================================================================
  stable-to-beta:
    name: "(Downstream) Stable → Beta"
    needs: [check-sync, beta-to-stable]
    if: |
      always() &&
      (needs.check-sync.outputs.stable_beta_diff == 'true' || needs.beta-to-stable.outputs.merged == 'true') &&
      (needs.beta-to-stable.result == 'success' || needs.beta-to-stable.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git User
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Fetch all branches
        run: git fetch origin

      - name: Merge Stable into Beta
        id: merge
        run: |
          git checkout Beta
          git pull origin Beta

          BEFORE_SHA=$(git rev-parse HEAD)
          git merge origin/Stable --no-edit
          AFTER_SHA=$(git rev-parse HEAD)

          if [ "$BEFORE_SHA" != "$AFTER_SHA" ]; then
            git push origin Beta
            echo "merged=true" >> $GITHUB_OUTPUT
          else
            echo "merged=false" >> $GITHUB_OUTPUT
          fi

  # ============================================================================
  # JOB 4: (Downstream) Beta → Nightly
  # ============================================================================
  beta-to-nightly:
    name: "(Downstream) Beta → Nightly"
    needs: [check-sync, stable-to-beta]
    if: |
      always() &&
      (needs.check-sync.outputs.beta_nightly_diff == 'true' || needs.stable-to-beta.outputs.merged == 'true') &&
      (needs.stable-to-beta.result == 'success' || needs.stable-to-beta.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git User
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Fetch all branches
        run: git fetch origin

      - name: Merge Beta into Nightly
        run: |
          git checkout Nightly
          git pull origin Nightly
          git merge origin/Beta --no-edit
          git push origin Nightly

  # ============================================================================
  # JOB 5: (Deploy) PWA - Conditional
  # ============================================================================
  deploy-pwa:
    name: "(Deploy) PWA"
    needs: beta-to-stable
    if: always() && needs.beta-to-stable.outputs.pwa_changed == 'true' && needs.beta-to-stable.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger PWA Deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Triggering PWA Deployment (System: Nominal)..."
          gh workflow run deploy-pwa.yml --ref Stable -R ${{ github.repository }}

  # ============================================================================
  # JOB 6: (Deploy) GAS - Conditional
  # ============================================================================
  deploy-gas:
    name: "(Deploy) GAS"
    needs: beta-to-stable
    if: always() && needs.beta-to-stable.outputs.gas_changed == 'true' && needs.beta-to-stable.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger GAS Deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Triggering GAS Deployment (System: Nominal)..."
          gh workflow run deploy-gas.yml --ref Stable -R ${{ github.repository }}

  # ============================================================================
  # JOB 7: (Deploy) Worker - Conditional
  # ============================================================================
  deploy-worker:
    name: "(Deploy) Worker"
    needs: beta-to-stable
    if: always() && needs.beta-to-stable.outputs.worker_changed == 'true' && needs.beta-to-stable.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Worker Deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Triggering Worker Deployment (System: Nominal)..."
          gh workflow run deploy-worker.yml --ref Stable -R ${{ github.repository }}
