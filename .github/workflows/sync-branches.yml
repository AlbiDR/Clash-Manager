name: Sync Branches


on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  # Matches the `packageManager` field in the root package.json.
  # Pinning ensures reproducible installs and prevents accidental pnpm version
  # drift across runs. The v10/v11 layout WARN emitted by the runner shim is
  # cosmetic only; the downgrade completes successfully regardless.
  PNPM_VERSION: "10.32.1"

# ============================================================================
# JOB 0: Pre-sync Check
# ============================================================================
jobs:
  check-sync:
    name: "Initial Difference Detection"
    runs-on: ubuntu-latest
    outputs:
      nightly_beta_diff: ${{ steps.check.outputs.nightly_beta_diff }}
      nightly_beta_diverged: ${{ steps.check.outputs.nightly_beta_diverged }}
      beta_stable_diff: ${{ steps.check.outputs.beta_stable_diff }}
      stable_beta_diff: ${{ steps.check.outputs.stable_beta_diff }}
      beta_nightly_diff: ${{ steps.check.outputs.beta_nightly_diff }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for differences
        id: check
        run: |
          git fetch origin

          # ----------------------------------------------------------------
          # Nightly -> Beta
          # Checks both directions to detect a TRUE divergence (both branches
          # have commits the other does not). A divergence requires conflict-
          # tolerant merge strategy (-X theirs). A normal ahead/behind does not.
          # ----------------------------------------------------------------
          NIGHTLY_IN_BETA=$(git merge-base --is-ancestor origin/Nightly origin/Beta && echo "true" || echo "false")
          BETA_IN_NIGHTLY=$(git merge-base --is-ancestor origin/Beta origin/Nightly && echo "true" || echo "false")

          if [ "$NIGHTLY_IN_BETA" = "true" ]; then
            # Beta already contains all of Nightly. No upstream sync needed.
            echo "nightly_beta_diff=false" >> $GITHUB_OUTPUT
            echo "nightly_beta_diverged=false" >> $GITHUB_OUTPUT
          else
            echo "nightly_beta_diff=true" >> $GITHUB_OUTPUT
            if [ "$BETA_IN_NIGHTLY" = "false" ]; then
              # Both branches have commits the other doesn't: TRUE DIVERGENCE.
              # This happens when a direct push is made to Beta outside the pipeline.
              echo "nightly_beta_diverged=true" >> $GITHUB_OUTPUT
              echo "::warning::Nightly and Beta have DIVERGED. A conflict-tolerant merge (-X theirs) will be used, preserving Nightly as the source of truth."
            else
              echo "nightly_beta_diverged=false" >> $GITHUB_OUTPUT
            fi
          fi

          # Beta -> Stable
          if git merge-base --is-ancestor origin/Beta origin/Stable; then
            echo "beta_stable_diff=false" >> $GITHUB_OUTPUT
          else
            echo "beta_stable_diff=true" >> $GITHUB_OUTPUT
          fi

          # Stable -> Beta
          if git merge-base --is-ancestor origin/Stable origin/Beta; then
            echo "stable_beta_diff=false" >> $GITHUB_OUTPUT
          else
            echo "stable_beta_diff=true" >> $GITHUB_OUTPUT
          fi

          # Beta -> Nightly
          if git merge-base --is-ancestor origin/Beta origin/Nightly; then
            echo "beta_nightly_diff=false" >> $GITHUB_OUTPUT
          else
            echo "beta_nightly_diff=true" >> $GITHUB_OUTPUT
          fi

  # ============================================================================
  # JOB 1: (Upstream) Nightly → Beta
  # ============================================================================
  nightly-to-beta:
    name: "(Upstream) Nightly → Beta"
    needs: check-sync
    if: needs.check-sync.outputs.nightly_beta_diff == 'true'
    runs-on: ubuntu-latest
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: Beta
          fetch-depth: 0

      - name: Setup Git User
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Restore pnpm store cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: "Air Gap Guard - BEFORE (Beta baseline)"
        id: test-before
        run: |
          echo "## Air Gap Guard" >> $GITHUB_STEP_SUMMARY
          echo "### BEFORE - Beta baseline (pre-merge)" >> $GITHUB_STEP_SUMMARY
          if pnpm test; then
            echo "before=pass" >> $GITHUB_OUTPUT
            echo "Beta baseline: PASS" >> $GITHUB_STEP_SUMMARY
          else
            echo "before=fail" >> $GITHUB_OUTPUT
            echo "Beta baseline: FAIL" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Normalise APK release slot (pre-merge)
        run: |
          git fetch origin

          # ----------------------------------------------------------------
          # A rename/rename conflict arises when both branches independently
          # rename the same base APK blob to different filenames. Git cannot
          # auto-resolve this class of conflict, even with -X theirs.
          #
          # Prevention: before the merge, replace every versioned APK in the
          # working tree (Beta checkout) with the authoritative file from
          # Nightly, then commit. Both sides of the merge now reference the
          # same filename, so no structural conflict can arise.
          # ----------------------------------------------------------------
          NIGHTLY_APK=$(git ls-tree origin/Nightly APK/release/ \
            | awk '{print $4}' \
            | grep 'clashmanager-v.*\.apk$')

          if [ -n "$NIGHTLY_APK" ]; then
            NIGHTLY_BASENAME=$(basename "$NIGHTLY_APK")

            # Remove every versioned release APK that is not the Nightly one.
            git ls-files APK/release/ | grep 'clashmanager-v.*\.apk$' | while read -r OLD; do
              OLD_BASENAME=$(basename "$OLD")
              if [ "$OLD_BASENAME" != "$NIGHTLY_BASENAME" ]; then
                git rm --cached --force "$OLD" 2>/dev/null || true
                rm -f "$OLD"
              fi
            done

            # Write the Nightly APK into place if it is not already present.
            if [ ! -f "APK/release/$NIGHTLY_BASENAME" ]; then
              git show "origin/Nightly:$NIGHTLY_APK" > "APK/release/$NIGHTLY_BASENAME"
              git add "APK/release/$NIGHTLY_BASENAME"
            fi

            # Also align latest.json so it agrees with the incoming APK.
            git show origin/Nightly:APK/release/latest.json > APK/release/latest.json
            git add APK/release/latest.json

            if ! git diff --cached --quiet; then
              git commit -m "chore(sync): pre-align APK release slot to Nightly before merge [skip ci]"
            fi
          fi

      - name: Merge Nightly into Beta
        id: merge
        run: |
          git fetch origin

          # ----------------------------------------------------------------
          # Robustness: If branches have diverged, use `-X theirs` to prefer
          # Nightly as the authoritative source. Nightly is the primary
          # integration target for all automated pipeline work; it must always
          # win over any out-of-band direct pushes to Beta.
          # ----------------------------------------------------------------
          DIVERGED="${{ needs.check-sync.outputs.nightly_beta_diverged }}"
          if [ "$DIVERGED" = "true" ]; then
            echo "Diverged branches detected. Merging with conflict strategy: Nightly wins (-X theirs)."
            git merge origin/Nightly -X theirs --no-edit
          else
            git merge origin/Nightly --no-edit
          fi

          git push origin Beta
          echo "merged=true" >> $GITHUB_OUTPUT

      - name: "Air Gap Guard - AFTER (Beta + Nightly combined)"
        id: test-after
        run: |
          echo "### AFTER - Beta + Nightly combined (post-merge)" >> $GITHUB_STEP_SUMMARY
          if pnpm test; then
            echo "after=pass" >> $GITHUB_OUTPUT
            echo "Combined state: PASS" >> $GITHUB_STEP_SUMMARY
          else
            echo "after=fail" >> $GITHUB_OUTPUT
            echo "Combined state: FAIL - Nightly introduced a regression." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> The merge has been pushed. Manual intervention required to revert" >> $GITHUB_STEP_SUMMARY
            echo "> the offending Nightly commit(s) before the next sync cycle." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: "Air Gap Guard - Regression Summary"
        if: always()
        run: |
          BEFORE="${{ steps.test-before.outputs.before }}"
          AFTER="${{ steps.test-after.outputs.after }}"
          echo "### Regression Delta" >> $GITHUB_STEP_SUMMARY
          echo "| Phase | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Beta baseline (before) | $BEFORE |" >> $GITHUB_STEP_SUMMARY
          echo "| Beta + Nightly (after) | ${AFTER:-blocked} |" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # JOB 2: (Upstream) Beta → Stable
  # ============================================================================
  beta-to-stable:
    name: "(Upstream) Beta → Stable"
    needs: [check-sync, nightly-to-beta]
    if: |
      always() &&
      (needs.check-sync.outputs.beta_stable_diff == 'true' || needs.nightly-to-beta.outputs.merged == 'true') &&
      (needs.nightly-to-beta.result == 'success' || needs.nightly-to-beta.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
      pwa_changed: ${{ steps.detect.outputs.pwa_changed }}
      backend_changed: ${{ steps.detect.outputs.backend_changed }}
      apk_changed: ${{ steps.detect.outputs.apk_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git User
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Merge Beta into Stable
        id: merge
        run: |
          git checkout Stable
          git pull origin Stable

          BEFORE_SHA=$(git rev-parse HEAD)
          # Beta is always the source of truth for Stable promotion.
          # Use -X theirs to ensure Beta content wins on any unexpected divergence.
          git merge origin/Beta -X theirs --no-edit
          AFTER_SHA=$(git rev-parse HEAD)

          echo "before_sha=$BEFORE_SHA" >> $GITHUB_OUTPUT
          echo "after_sha=$AFTER_SHA" >> $GITHUB_OUTPUT

          if [ "$BEFORE_SHA" != "$AFTER_SHA" ]; then
            git push origin Stable
            echo "merged=true" >> $GITHUB_OUTPUT
          else
            echo "merged=false" >> $GITHUB_OUTPUT
          fi

      - name: Detect Changed Files
        id: detect
        run: |
          if [ "${{ steps.merge.outputs.merged }}" == "true" ]; then
            BEFORE=${{ steps.merge.outputs.before_sha }}
            AFTER=${{ steps.merge.outputs.after_sha }}

            # PWA: Frontend-PWA/** or deploy-pwa.yml, excluding .md files
            if git diff --name-only $BEFORE $AFTER | grep -E "^Frontend-PWA/|^\.github/workflows/deploy-pwa\.yml" | grep -v "\.md$" > /dev/null; then
              echo "pwa_changed=true" >> $GITHUB_OUTPUT
            else
              echo "pwa_changed=false" >> $GITHUB_OUTPUT
            fi

            # Backend: Backend/** or deploy-supabase.yml
            if git diff --name-only $BEFORE $AFTER | grep -E "^Backend/|^\.github/workflows/deploy-supabase\.yml" | grep -v "\.md$" > /dev/null; then
              echo "backend_changed=true" >> $GITHUB_OUTPUT
            else
              echo "backend_changed=false" >> $GITHUB_OUTPUT
            fi

            # APK: APK/src/** or APK/android/** (excluding build outputs and docs)
            # Mirrors the path filter defined in apk-release.yml.
            if git diff --name-only $BEFORE $AFTER \
                | grep -E "^APK/(src|android)/|^\.github/workflows/apk-release\.yml|^APK/verify-apk-integrity\.mjs" \
                | grep -vE "^APK/android/classes\.dex$|^APK/release/|^APK/.*\.md$" \
                > /dev/null; then
              echo "apk_changed=true" >> $GITHUB_OUTPUT
            else
              echo "apk_changed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "pwa_changed=false" >> $GITHUB_OUTPUT
            echo "backend_changed=false" >> $GITHUB_OUTPUT
            echo "apk_changed=false" >> $GITHUB_OUTPUT
          fi

  # ============================================================================
  # JOB 3: (Downstream) Stable → Beta
  # ============================================================================
  stable-to-beta:
    name: "(Downstream) Stable → Beta"
    needs: [check-sync, beta-to-stable]
    if: |
      always() &&
      (needs.check-sync.outputs.stable_beta_diff == 'true' || needs.beta-to-stable.outputs.merged == 'true') &&
      (needs.beta-to-stable.result == 'success' || needs.beta-to-stable.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git User
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Merge Stable into Beta
        id: merge
        run: |
          git checkout Beta
          git pull origin Beta

          BEFORE_SHA=$(git rev-parse HEAD)
          # Stable content (hotfixes) always wins when flowing downstream to Beta.
          git merge origin/Stable -X theirs --no-edit
          AFTER_SHA=$(git rev-parse HEAD)

          if [ "$BEFORE_SHA" != "$AFTER_SHA" ]; then
            git push origin Beta
            echo "merged=true" >> $GITHUB_OUTPUT
          else
            echo "merged=false" >> $GITHUB_OUTPUT
          fi

  # ============================================================================
  # JOB 4: (Downstream) Beta → Nightly
  # ============================================================================
  beta-to-nightly:
    name: "(Downstream) Beta → Nightly"
    needs: [check-sync, stable-to-beta]
    if: |
      always() &&
      (needs.check-sync.outputs.beta_nightly_diff == 'true' || needs.stable-to-beta.outputs.merged == 'true') &&
      (needs.stable-to-beta.result == 'success' || needs.stable-to-beta.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: Beta
          fetch-depth: 0

      - name: Setup Git User
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Normalise APK release slot (pre-merge)
        run: |
          git fetch origin
          git checkout Nightly
          git pull origin Nightly

          # ----------------------------------------------------------------
          # Mirror of the normalisation in Job 1. Here Beta is the
          # authoritative source flowing downstream into Nightly.
          # ----------------------------------------------------------------
          BETA_APK=$(git ls-tree origin/Beta APK/release/ \
            | awk '{print $4}' \
            | grep 'clashmanager-v.*\.apk$')

          if [ -n "$BETA_APK" ]; then
            BETA_BASENAME=$(basename "$BETA_APK")

            git ls-files APK/release/ | grep 'clashmanager-v.*\.apk$' | while read -r OLD; do
              OLD_BASENAME=$(basename "$OLD")
              if [ "$OLD_BASENAME" != "$BETA_BASENAME" ]; then
                git rm --cached --force "$OLD" 2>/dev/null || true
                rm -f "$OLD"
              fi
            done

            if [ ! -f "APK/release/$BETA_BASENAME" ]; then
              git show "origin/Beta:$BETA_APK" > "APK/release/$BETA_BASENAME"
              git add "APK/release/$BETA_BASENAME"
            fi

            git show origin/Beta:APK/release/latest.json > APK/release/latest.json
            git add APK/release/latest.json

            if ! git diff --cached --quiet; then
              git commit -m "chore(sync): pre-align APK release slot to Beta before merge [skip ci]"
            fi
          fi

      - name: Merge Beta into Nightly
        run: |
          git checkout Nightly
          git pull origin Nightly
          # Code flowing in was already verified by the Air Gap Guard in
          # JOB 1 (Nightly -> Beta). A second test run here would be
          # redundant by transitivity.
          git merge origin/Beta -X theirs --no-edit
          git push origin Nightly

  # ============================================================================
  # JOB 5: (Deploy) PWA - Conditional
  # ============================================================================
  deploy-pwa:
    name: "(Deploy) PWA"
    needs: beta-to-stable
    if: always() && needs.beta-to-stable.outputs.pwa_changed == 'true' && needs.beta-to-stable.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger PWA Deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Triggering PWA Deployment (System: Nominal)..."
          gh workflow run deploy-pwa.yml --ref Stable -R ${{ github.repository }}

  deploy-supabase:
    name: "(Deploy) Supabase"
    needs: beta-to-stable
    if: always() && needs.beta-to-stable.outputs.backend_changed == 'true' && needs.beta-to-stable.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Supabase Deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Triggering Supabase Deployment (System: Nominal)..."
          gh workflow run deploy-supabase.yml --ref Stable -R ${{ github.repository }}

  # ============================================================================
  # JOB 6: (Deploy) APK - Conditional
  # ============================================================================
  deploy-apk:
    name: "(Deploy) APK"
    needs: beta-to-stable
    if: always() && needs.beta-to-stable.outputs.apk_changed == 'true' && needs.beta-to-stable.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger APK Release Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Triggering APK Release Build (System: Nominal)..."
          gh workflow run apk-release.yml --ref Stable -R ${{ github.repository }}
