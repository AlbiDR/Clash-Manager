name: Secret Scan

on:
  push:
    branches:
      - Stable
      - main
      - master
  pull_request:
    branches:
      - Stable
      - main
      - master

jobs:
  trufflehog-scan:
    name: TruffleHog secret scan
    runs-on: ubuntu-latest
    # Note: previously used an upstream TruffleHog Action which was removed; this job installs and runs TruffleHog directly.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install TruffleHog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin

      - name: Run TruffleHog filesystem scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          trufflehog filesystem --json "${{ github.workspace }}" > trufflehog.json || true
          if [ -s trufflehog.json ]; then
            echo "Potential secret findings detected by TruffleHog (filesystem):" 
            cat trufflehog.json
            exit 1
          else
            echo "No filesystem findings"
          fi

      - name: Upload filesystem scan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trufflehog-filesystem
          path: trufflehog.json

      - name: Run TruffleHog git history scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          trufflehog git https://github.com/${{ github.repository }} --json > trufflehog-git.json || true
          if [ -s trufflehog-git.json ]; then
            echo "Potential secret findings detected by TruffleHog (git history):"
            cat trufflehog-git.json
            exit 1
          else
            echo "No git history findings"
          fi

      - name: Upload git-history scan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trufflehog-git
          path: trufflehog-git.json
