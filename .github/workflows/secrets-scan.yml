name: Secret Scan

on:
  push:
    branches:
      - Stable
      - main
      - master
  pull_request:
    branches:
      - Stable
      - main
      - master

jobs:
  trufflehog-scan:
    name: TruffleHog secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run TruffleHog secret scan
        uses: trufflesecurity/trufflehog-action@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          scan: filesystem

      - name: Fail on findings
        if: steps.trufflehog-scan.outcome == 'failure'
        run: |
          echo "Potential secret findings detected by TruffleHog. Please review and remove any committed secrets." 
          exit 1
