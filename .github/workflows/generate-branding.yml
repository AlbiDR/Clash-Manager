name: Generate Branding Assets

on:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: Frontend-PWA

jobs:
  branding:
    name: Capture & Optimize
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false


      - name: Install Dependencies
        working-directory: .
        run: pnpm install --no-frozen-lockfile

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y webp

      - name: Setup shot-scraper
        run: |
          pip install shot-scraper
          shot-scraper install

      - name: Start Dev Server
        run: |
          pnpm run dev &
          # Wait for the dev server to be ready and the specific portfolio entry point
          npx wait-on http://localhost:5173/Clash-Manager/portfolio-stitch.html --timeout 120000

      - name: Run Branding Pipeline
        run: bash scratch/generate_hifi_branding.sh

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Stage the generated assets
          git add public/assets/branding/*.webp
          
          # Check if there are changes to commit
          if ! git diff --cached --exit-code; then
            echo "Changes detected, stashing and pulling latest..."
            git stash
            git pull --rebase origin ${{ github.ref_name }}
            git stash pop
            
            # Re-stage and commit
            git add public/assets/branding/*.webp
            git commit -m "chore(branding): automated regeneration of high-fidelity assets"
            git push origin ${{ github.ref_name }}
          else
            echo "No changes detected in branding assets."
          fi

