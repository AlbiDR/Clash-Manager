name: Validate Project

on:
  push:
    paths:
      - 'Backend-GAS/Configuration.gs.js'
      - 'README.md'
      - '.github/workflows/validate-scoring.yml'
  pull_request:
    paths:
      - 'Backend-GAS/Configuration.gs.js'
      - 'README.md'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Project Integrity Check
        run: node scripts/validate_project.js
