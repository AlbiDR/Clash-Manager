# Reproducible APK release build — proves the signed APK can be rebuilt OFF the
# maintainer's laptop, and that the committed APK/build-apk-out/clashmanager.apk
# still matches APK/android/ source (drift guard).
#
# Signing material comes from repo Secrets (the keystore itself is NOT in the
# repo): ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
# ANDROID_KEY_PASSWORD / ANDROID_KEY_ALIAS.
name: APK Release Build

on:
  workflow_dispatch:
  push:
    paths:
      - "APK/android/**"
      - "APK/verify-apk-integrity.mjs"
      - "APK/verify-apk-drift.mjs"
      - ".github/workflows/apk-release.yml"

permissions:
  contents: write

jobs:
  build-sign-verify:
    runs-on: ubuntu-latest
    env:
      BT_VERSION: "35.0.0"
      APKTOOL_VERSION: "3.0.2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android build-tools ${{ env.BT_VERSION }}
        run: sdkmanager "build-tools;${{ env.BT_VERSION }}"

      - name: Download apktool ${{ env.APKTOOL_VERSION }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/apktool.jar" \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar"

      - name: Build APK from APK/android (apktool)
        run: java -jar "$RUNNER_TEMP/apktool.jar" b APK/android -o "$RUNNER_TEMP/fresh-unsigned.apk"

      - name: Decode signing keystore from secret
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Zipalign + sign
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          BT="$ANDROID_SDK_ROOT/build-tools/${BT_VERSION}"
          "$BT/zipalign" -f -p 4 "$RUNNER_TEMP/fresh-unsigned.apk" "$RUNNER_TEMP/fresh-aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "env:KS_PASS" --key-pass "env:KEY_PASS" \
            --out "$RUNNER_TEMP/clashmanager.apk" "$RUNNER_TEMP/fresh-aligned.apk"
          "$BT/apksigner" verify --print-certs "$RUNNER_TEMP/clashmanager.apk"

      - name: Native-layer integrity gate
        env:
          AAPT2: ${{ env.ANDROID_SDK_ROOT }}/build-tools/35.0.0/aapt2
        run: |
          export AAPT2="$ANDROID_SDK_ROOT/build-tools/${BT_VERSION}/aapt2"
          node APK/verify-apk-integrity.mjs "$RUNNER_TEMP/clashmanager.apk"

      - name: Drift guard (committed APK vs fresh build)
        run: node APK/verify-apk-drift.mjs APK/build-apk-out/clashmanager.apk "$RUNNER_TEMP/fresh-unsigned.apk"

      - name: Commit signed APK back to repository
        run: |
          cp "$RUNNER_TEMP/clashmanager.apk" APK/build-apk-out/clashmanager.apk
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add APK/build-apk-out/clashmanager.apk
          git diff --cached --quiet \
            && echo "No APK changes to commit" \
            || (git commit -m "chore(apk): update signed release APK [skip ci]" && git push)

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: clashmanager-signed-apk
          path: ${{ runner.temp }}/clashmanager.apk
          if-no-files-found: error
