# Reproducible APK release build. The native Java source lives in APK/src/ and
# is compiled into the checked-in APK/android/classes.dex before release. This
# workflow intentionally packages that committed dex, but first proves it still
# matches the source with the same pinned toolchain and apktool used locally.
# It then builds, signs, and publishes the versioned release APK.
#
# Ordering: triggered by Auto Tag's completion, not by `push` directly. Root cause:
# a plain `push` trigger here races Auto Tag's own `push` trigger on the same
# commit - both fire independently off Sync Branches landing a merge. Every
# meaningful push already bumps package.json in the same commit (the "bump on
# every push" policy - see .github/scripts/project/bump-version.mjs), so Auto Tag fires on
# essentially every push this workflow cares about; chaining off it via
# `workflow_run` guarantees tagging always completes before the APK build starts,
# without needing a second, independently-racing trigger.
#
# Path filter rules (now applied by the "Check for relevant changes" step, since
# `workflow_run` cannot filter by path the way `push` can):
#   Included : APK/src/**, APK/android/** (including a rebuilt classes.dex), and
#              the pinned-toolchain/source-verification inputs below.
#   Included : APK/verify-apk-integrity.mjs (integrity gate used by this workflow)
#   Excluded : APK/release/**            - build output, never an input.
#   Excluded : APK/**/*.md               - documentation only, no effect on the binary.
#
# The release commit only changes APK/release/**. It cannot re-enter through
# workflow_run: Auto Tag itself is limited to package.json changes, while a
# developer-rebuilt classes.dex must remain a release input.
#
# The release commit deliberately does NOT carry `[skip ci]`: that keyword skips every
# push-triggered workflow on the commit, not just this one, and previously suppressed
# Deploy PWA's `APK/release/**` path trigger too - so the PWA's same-origin latest.json
# and companion binary silently kept serving the PREVIOUS release indefinitely, causing
# in-app "release metadata mismatch" / stale checksum reports right after users updated.
# The release commit cannot re-enter APK Release Build (see the workflow_run
# note above), so it is safe to let Deploy PWA and APK Integrity run normally.
#
# Signing material comes from repo Secrets (the keystore itself is NOT in the
# repo): ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
# ANDROID_KEY_PASSWORD / ANDROID_KEY_ALIAS.
name: APK Release Build

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Auto Tag"]
    types: [completed]
    branches: ["Beta", "Stable"]

permissions:
  actions: write
  contents: write

concurrency:
  group: apk-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0

      - name: Check for relevant changes
        id: filter
        run: |
          if [ "${{ github.event_name }}" != "workflow_run" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE="${{ github.event.workflow_run.head_sha }}~1"
          if ! git cat-file -e "${BASE}" 2>/dev/null; then
            echo "No parent commit (shallow/initial) - proceeding with build."
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "${BASE}" "${{ github.event.workflow_run.head_sha }}")
          echo "Changed files since Auto Tag's triggering commit:"
          echo "${CHANGED}"
          RELEVANT=false
          for f in ${CHANGED}; do
            case "$f" in
              APK/release/*|*.md) continue ;;
              APK/src/*|APK/android/*|APK/toolchain.json|APK/toolchain-env.sh|APK/fetch-build-deps.mjs|APK/build-apk.sh|APK/verify-dex-source.mjs|APK/verify-apk-integrity.mjs|.github/workflows/apk-release.yml)
                RELEVANT=true ;;
            esac
          done
          echo "relevant=${RELEVANT}" >> "$GITHUB_OUTPUT"
          if [ "${RELEVANT}" != "true" ]; then
            echo "Auto Tag completed but no native source, checked-in APK, toolchain, or release-gate changes were in its commit. Skipping build."
          fi

  build-sign-verify:
    needs: check
    if: ${{ needs.check.outputs.relevant == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Read the pinned native toolchain
        id: toolchain
        run: |
          jdk="$(node APK/fetch-build-deps.mjs get jdkMajor)"
          build_tools="$(node APK/fetch-build-deps.mjs get buildTools)"
          platform="$(node APK/fetch-build-deps.mjs get androidPlatform)"
          echo "jdk=$jdk" >> "$GITHUB_OUTPUT"
          echo "build_tools=$build_tools" >> "$GITHUB_OUTPUT"
          echo "platform=$platform" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.jdk }}

      # v3 installs Android's retired `tools` package, which makes sdkmanager
      # exit before the APK can be built. v4 uses the supported SDK packages.
      - uses: android-actions/setup-android@v4

      - name: Install pinned Android packages
        run: sdkmanager "build-tools;${{ steps.toolchain.outputs.build_tools }}" "platforms;${{ steps.toolchain.outputs.platform }}"

      - name: Cache pinned build inputs
        uses: actions/cache@v4
        with:
          path: APK/.deps
          key: apk-deps-${{ hashFiles('APK/toolchain.json') }}

      - name: Resolve hash-verified apktool
        id: apktool
        run: |
          jar="$(node APK/fetch-build-deps.mjs apktool)"
          echo "jar=$jar" >> "$GITHUB_OUTPUT"

      - name: Verify committed dex matches the current Java source
        env:
          APKTOOL_JAR: ${{ steps.apktool.outputs.jar }}
        run: ./APK/build-apk.sh --check

      - name: Extract APK version from config
        id: version
        run: |
          VERSION=$(grep "versionName:" APK/android/apktool.yml | awk '{print $2}')
          echo "APK version found: $VERSION"
          echo "val=$VERSION" >> $GITHUB_OUTPUT

      - name: Stamp build number
        id: buildnum
        # github.run_number is a per-workflow monotonic counter, unlike versionCode
        # (derived purely from versionName - see verify-apk-integrity.mjs), so two
        # builds of the SAME package.json version get distinct build numbers. This
        # lets recency be told apart from a downloaded APK alone, without needing
        # the git repository. Edits the CI workspace copy only - APK/android/ itself
        # is never committed back by this workflow.
        run: |
          BUILD_NUMBER="${{ github.run_number }}"
          sed -i "s/<string name=\"buildNumber\">0<\/string>/<string name=\"buildNumber\">${BUILD_NUMBER}<\/string>/" \
            APK/android/res/values/strings.xml
          echo "val=$BUILD_NUMBER" >> $GITHUB_OUTPUT

      - name: Build APK from verified APK/android
        env:
          APKTOOL_JAR: ${{ steps.apktool.outputs.jar }}
        run: java -jar "$APKTOOL_JAR" b APK/android -o "$RUNNER_TEMP/fresh-unsigned.apk"

      - name: Decode signing keystore from secret
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Zipalign + sign
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VERSION: ${{ steps.version.outputs.val }}
          BUILD_NUMBER: ${{ steps.buildnum.outputs.val }}
          BT_VERSION: ${{ steps.toolchain.outputs.build_tools }}
        run: |
          BT="$ANDROID_SDK_ROOT/build-tools/${BT_VERSION}"
          "$BT/zipalign" -f -p 4 "$RUNNER_TEMP/fresh-unsigned.apk" "$RUNNER_TEMP/fresh-aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "env:KS_PASS" --key-pass "env:KEY_PASS" \
            --out "$RUNNER_TEMP/clashmanager-v${VERSION}+${BUILD_NUMBER}.apk" "$RUNNER_TEMP/fresh-aligned.apk"
          "$BT/apksigner" verify --print-certs "$RUNNER_TEMP/clashmanager-v${VERSION}+${BUILD_NUMBER}.apk"

      - name: Native-layer integrity gate
        env:
          VERSION: ${{ steps.version.outputs.val }}
          BUILD_NUMBER: ${{ steps.buildnum.outputs.val }}
          BT_VERSION: ${{ steps.toolchain.outputs.build_tools }}
        run: |
          export AAPT2="$ANDROID_SDK_ROOT/build-tools/${BT_VERSION}/aapt2"
          node APK/verify-apk-integrity.mjs "$RUNNER_TEMP/clashmanager-v${VERSION}+${BUILD_NUMBER}.apk"

      - name: Commit signed APK back to repository
        env:
          VERSION: ${{ steps.version.outputs.val }}
          BUILD_NUMBER: ${{ steps.buildnum.outputs.val }}
          # The branch Auto Tag fired on, which is the branch this run already
          # checked out by head_sha. It was hardcoded to Beta, so a Stable-
          # triggered build pushed its APK at Beta: Stable's own release slot
          # never advanced (it sat at v14.50.103+391 while Stable was 14.50.104),
          # and when that push raced a real Beta push it resolved the conflict by
          # absorbing Beta, producing an 11-file commit with 93 deletions aimed at
          # Beta on 2026-09-13. That one was rejected non-fast-forward; a winning
          # race would have published Stable's tree onto Beta.
          # head_branch is the same half the concurrency group keys on, so a run
          # can no longer serialise against one branch while pushing to another.
          # The fallback differs deliberately: the group can use github.ref, but
          # git needs the bare name, and on workflow_dispatch this now publishes
          # to the branch it was dispatched from rather than always to Beta.
          TARGET_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          FILENAME="clashmanager-v${VERSION}+${BUILD_NUMBER}.apk"

          write_release() {
            # Clean any old versioned APK files from release to maintain a single release binary
            git rm -f --ignore-unmatch APK/release/clashmanager-v*.apk APK/release/clashmanager-latest.apk

            mkdir -p APK/release
            cp "$RUNNER_TEMP/${FILENAME}" "APK/release/${FILENAME}"
            APK_SIZE="$(wc -c < "APK/release/${FILENAME}" | tr -d ' ')"
            APK_SHA256="$(sha256sum "APK/release/${FILENAME}" | awk '{print $1}')"
            git add "APK/release/${FILENAME}"

            # latest.json is the stable pointer to the one tracked versioned APK.
            # The PWA reads it to preserve the versioned download filename while
            # avoiding a second binary artifact in APK/release.
            cat > APK/release/latest.json <<EOF
          {
            "version": "${VERSION}",
            "buildNumber": ${BUILD_NUMBER},
            "filename": "${FILENAME}",
            "sizeBytes": ${APK_SIZE},
            "sha256": "${APK_SHA256}",
            "changelog": [
              "Signed Android shell rebuilt from the latest native source."
            ]
          }
          EOF
            git add APK/release/latest.json
          }

          write_release

          if git diff --cached --quiet; then
            echo "No APK changes to commit"
          else
            git commit -m "chore(apk): update signed release APK to v${VERSION}+${BUILD_NUMBER}"

            # Fetch latest remote changes
            git fetch origin "$TARGET_BRANCH"

            # If the remote has moved, reset branch pointer but keep our new APK file intact
            if [ "$(git rev-parse HEAD~1)" != "$(git rev-parse "origin/$TARGET_BRANCH")" ]; then
              echo "Remote branch moved. Syncing and resolving conflict..."
              git reset --soft "origin/$TARGET_BRANCH"
              write_release
              git commit --amend -m "chore(apk): update signed release APK to v${VERSION}+${BUILD_NUMBER}"
            fi

            git push origin "HEAD:$TARGET_BRANCH" || {
              echo "Push failed. Checking whether this version is already published..."
              git fetch origin "$TARGET_BRANCH"
              # Match on VERSION alone, never VERSION+BUILD_NUMBER. BUILD_NUMBER
              # is github.run_number, so it is unique to THIS run: grepping for
              # it can only ever match a commit this same run pushed, which is
              # not the case this fallback exists for. A concurrent run always
              # carries a different build number, so the old check failed 100%
              # of the races it was written to absorb (v14.46.25: run +270 was
              # rejected while +269 held the identical signed artifact).
              # The artifact identity is the version; the build number is only
              # provenance.
              git ls-tree --name-only "origin/$TARGET_BRANCH" APK/release/ \
                | grep -q "clashmanager-v${VERSION}+.*\.apk" \
                && echo "A signed APK for v${VERSION} is already on $TARGET_BRANCH; nothing left to publish." \
                || exit 1
            }
          fi

      # Pushes made with this workflow's GITHUB_TOKEN do not start other
      # push-triggered workflows. Dispatch the PWA deploy explicitly so its
      # same-origin APK download and latest.json advance with this release.
      - name: Deploy PWA release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: gh workflow run deploy-pwa.yml --ref "$TARGET_BRANCH" -R "$GITHUB_REPOSITORY"

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: clashmanager-signed-apk
          path: ${{ runner.temp }}/clashmanager-v${{ steps.version.outputs.val }}+${{ steps.buildnum.outputs.val }}.apk
          if-no-files-found: error
