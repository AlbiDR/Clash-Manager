name: Document

on:
  push:
    branches: ["Stable", "Beta"]
    paths:
      - "README.md"
      - "docs/**"
      - "**/*.md"
      - "Backend-GAS/Configuration.gs.js"
      - ".github/workflows/document-project.yml"
  pull_request:
    branches: ["Stable"]
    paths:
      - "README.md"
      - "docs/**"
      - "**/*.md"
      - "Backend-GAS/Configuration.gs.js"
      - ".github/workflows/document-project.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  document:
    name: Document
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check file changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            docs:
              - 'README.md'
              - 'docs/**'
              - '**/*.md'
            sync_files:
              - 'Backend-GAS/Configuration.gs.js'
              - '.github/workflows/document-project.yml'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node.js
        if: steps.changes.outputs.sync_files == 'true' || steps.changes.outputs.docs == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Project Integrity Check
        if: steps.changes.outputs.sync_files == 'true'
        run: node scripts/validate_project.js

      - name: Documentation Cleanup
        if: steps.changes.outputs.docs == 'true'
        run: echo "Documentation changes detected. Validating formatting..."

      - name: Auto-Merge
        if: success() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge --auto --merge --delete-branch "${{ github.event.pull_request.html_url }}"
