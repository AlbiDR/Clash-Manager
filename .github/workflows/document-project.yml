name: Document

on:
  push:
    branches: ["Stable", "Beta"]
  pull_request:
    branches: ["Stable"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  document:
    name: Document
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check file changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            docs:
              - 'README.md'
              - 'docs/**'
              - '**/*.md'
            sync_files:
              - 'Backend-GAS/Configuration.gs.js'
              - '.github/workflows/validate-scoring.yml'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node.js
        if: steps.changes.outputs.sync_files == 'true' || steps.changes.outputs.docs == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Project Integrity Check
        if: steps.changes.outputs.sync_files == 'true'
        run: node scripts/validate_project.js

      - name: Documentation Cleanup
        if: steps.changes.outputs.docs == 'true'
        run: echo "Documentation changes detected. Validating formatting..."

      - name: No-op Success
        if: steps.changes.outputs.sync_files == 'false' && steps.changes.outputs.docs == 'false'
        run: echo "No documentation or sync-critical files changed. Marking as success."
