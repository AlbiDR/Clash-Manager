name: Sync Nightly PRs


on:
  schedule:
    # 10:00 AM CET
    - cron: "0 9 * * *"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - Nightly

concurrency:
  group: merge-nightly
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  # Matches the `packageManager` field in the root package.json.
  # Pinning ensures reproducible installs and prevents accidental pnpm version
  # drift across runs.
  PNPM_VERSION: "10.32.1"

# ============================================================================
# AUTOMATION ENGINE: Nightly PR Synchronization
# ============================================================================
jobs:
  merge-prs:
    name: "Merge Google Jules PRs"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # ----------------------------------------------------------------------
      # STEP 0: Event Buffer (Ensures Jules has finished PR setup)
      # ----------------------------------------------------------------------
      - name: Wait for PR Finalization
        if: github.event_name == 'pull_request'
        run: |
          echo "Triggered by PR event. Holding for 60s to allow GitHub indexing and PR finalization..."
          sleep 60

      # ----------------------------------------------------------------------
      # STEP 1: Environment Setup
      # ----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: Nightly

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Restore pnpm store cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # ----------------------------------------------------------------------
      # STEP 2: Execution Logic (Ultra-Robust)
      # ----------------------------------------------------------------------
      - name: Run Merge Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec tsx .github/scripts/merge-nightly-prs.ts

      # ----------------------------------------------------------------------
      # STEP 3: Persistence & Documentation
      # ----------------------------------------------------------------------
      - name: Commit and Push History
        run: |
          if [[ `git status --porcelain .github/nightly-logs/PR_HISTORY.md` ]]; then
            git config --global user.name 'github-actions[bot]'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
            git add .github/nightly-logs/PR_HISTORY.md
            git commit -m "docs: update changelog [skip ci]"
            git pull origin Nightly --rebase
            git push origin Nightly
          else
            echo "Changelog status: Nominal. No updates required."
          fi
