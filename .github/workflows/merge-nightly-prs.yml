name: Sync Nightly PRs

on:
  schedule:
    # 1:30 PM CEST: safety-net run after Jules completes Stage 13.
    - cron: "30 11 * * *"
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches:
      - Nightly

concurrency:
  group: merge-nightly
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-prs:
    name: "Merge Google Jules PRs"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: Nightly

      - name: Run Merge Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/merge-nightly-prs.mjs

      - name: Commit and Push History
        run: |
          if [[ `git status --porcelain .github/nightly-logs/00-pr-history.md` ]]; then
            git config --global user.name 'github-actions[bot]'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
            git add .github/nightly-logs/00-pr-history.md
            git commit -m "docs: update changelog [skip ci]"
            git pull origin Nightly --rebase
            git push origin Nightly
          else
            echo "Changelog status: Nominal. No updates required."
          fi
