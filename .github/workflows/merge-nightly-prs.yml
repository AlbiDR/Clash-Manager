name: Sync Nightly PRs

on:
  schedule:
    # 9:00 AM CET
    - cron: "0 8 * * *"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - Nightly
      - Nightly

concurrency:
  group: merge-nightly
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

# ============================================================================
# AUTOMATION ENGINE: Nightly PR Synchronization
# ============================================================================
jobs:
  merge-prs:
    name: "Merge Google Jules PRs"
    runs-on: ubuntu-latest
    steps:
      # ----------------------------------------------------------------------
      # STEP 0: Event Buffer (Ensures Jules has finished PR setup)
      # ----------------------------------------------------------------------
      - name: Wait for PR Finalization
        if: github.event_name == 'pull_request'
        run: |
          echo "Triggered by PR event. Waiting 5 minutes to ensure PR metadata is fully ready..."
          sleep 300

      # ----------------------------------------------------------------------
      # STEP 1: Environment Setup
      # ----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Nightly Branch Exists and Checkout
        run: |
          git fetch origin
          if git show-ref --verify --quiet refs/remotes/origin/Nightly; then
            echo "Branch 'Nightly' exists. Checking out..."
            git checkout Nightly
            git pull origin Nightly
          else
            echo "Branch 'Nightly' does not exist. Creating from current HEAD."
            git checkout -b Nightly
            git push origin Nightly
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

        # ----------------------------------------------------------------------
        # STEP 2: Execution Logic (Ultra-Robust)
        # ----------------------------------------------------------------------
      - name: Run Merge Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx .github/scripts/merge-nightly-prs.ts

      # ----------------------------------------------------------------------
      # STEP 3: Persistence & Documentation
      # ----------------------------------------------------------------------
      - name: Commit and Push Changelog
        run: |
          if [[ `git status --porcelain .nightly/CHANGELOG.md` ]]; then
            git config --global user.name 'github-actions[bot]'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
            git add .nightly/CHANGELOG.md
            git commit -m "docs: update changelog [skip ci]"
            git pull origin Nightly --rebase
            git push origin Nightly
          else
            echo "No changelog updates."
          fi
