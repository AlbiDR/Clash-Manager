name: "Auto-Format PR Title"

on:
  pull_request:
    types:
      - opened
      - edited

jobs:
  auto-rename:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo, number } = context.issue;
            const originalTitle = context.payload.pull_request.title;
            
            // 1. Regex to check if it's already compliant
            // Matches "type: " or "type(scope): "
            const ccRegex = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?:/;
            
            if (ccRegex.test(originalTitle)) {
              console.log("✅ Title is already Conventional Commits compliant.");
              return;
            }

            // 2. Define Heuristic Maps
            // Keys are the conventional types, Values are keywords to look for
            const typeMap = {
              feat: ["add", "added", "new", "create", "created", "implement", "implemented", "feature"],
              fix: ["fix", "fixed", "bug", "resolve", "resolved", "crash", "error", "correct", "corrected", "patch"],
              docs: ["doc", "docs", "document", "documentation", "readme", "comment", "comments"],
              style: ["style", "format", "formatting", "lint", "linting", "whitespace"],
              refactor: ["refactor", "refactored", "clean", "cleanup", "structure", "rewrite", "rewrote", "simplify"],
              perf: ["perf", "performance", "optimiz", "speed", "fast"],
              test: ["test", "tests", "spec", "coverage", "unit"],
              chore: ["chore", "update", "updated", "upgrade", "upgraded", "bump", "dep", "dependency", "config", "configuration"],
              ci: ["ci", "workflow", "pipeline", "action", "github"],
              build: ["build", "compile", "webpack", "vite", "rollup"]
            };

            const lowerTitle = originalTitle.toLowerCase();
            let matchedType = null;

            // 3. Find a match
            for (const [type, keywords] of Object.entries(typeMap)) {
              if (keywords.some(k => lowerTitle.startsWith(k))) {
                matchedType = type;
                break;
              }
            }

            // Default to 'chore' if it looks like a maintenance task but didn't match specific keywords
            // or just leave it alone if we really have no clue? 
            // Let's be aggressive: if we found a match, rename.
            
            if (matchedType) {
              // Convert first char of original title to lowercase for style
              // e.g. "Added thing" -> "added thing"
              const cleanBody = originalTitle.charAt(0).toLowerCase() + originalTitle.slice(1);
              const newTitle = `${matchedType}: ${cleanBody}`;
              
              console.log(`🤖 Auto-Renaming PR from "${originalTitle}" to "${newTitle}"`);
              
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: number,
                title: newTitle
              });
            } else {
              console.log("🤷 Could not determine intention from title. Leaving as is.");
            }
