name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Keystore
        run: |
          cd Frontend-PWA
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > signing.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Auto-Version
        id: versioning
        run: |
          cd Frontend-PWA
          # 1. Get Base Values
          V_NAME=$(jq -r '.appVersionName' twa-manifest.json)
          V_CODE=$(jq -r '.appVersionCode' twa-manifest.json)

          # 2. Override version name with Git Tag if present
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            V_NAME="${{ github.ref_name }}"
            V_NAME="${V_NAME#v}" # Remove 'v' prefix
          fi

          # 3. Scale Build Code using Run Number to ensure uniqueness
          # We use 1000 + run_number to avoid overlapping with legacy manual codes
          FINAL_CODE=$((1000 + github.run_number))
          BUILD_TAG="v${V_NAME}-b${FINAL_CODE}"

          # 4. Update manifest ephemerally for this build
          jq --arg name "$V_NAME" --argjson code "$FINAL_CODE" \
             '.appVersionName = $name | .appVersionCode = $code' \
             twa-manifest.json > twa-manifest.tmp && mv twa-manifest.tmp twa-manifest.json

          echo "version_code=$FINAL_CODE" >> $GITHUB_OUTPUT
          echo "v_name=$V_NAME" >> $GITHUB_OUTPUT
          echo "build_tag=$BUILD_TAG" >> $GITHUB_OUTPUT
          echo "apk_filename=clash-manager-$BUILD_TAG.apk" >> $GITHUB_OUTPUT

      - name: Generate Android Project
        run: |
          cd Frontend-PWA

          echo "🔑 Extracting SHA256 fingerprint from keystore..."
          SHA256=$(keytool -list -v -keystore signing.keystore -alias clash_manager_release -storepass "$KEYSTORE_PASSWORD" | grep SHA256 | awk '{print $2}')
          echo "   Fingerprint: $SHA256"
          export ANDROID_SHA256=$SHA256

          echo "📦 Generating Android project from twa-manifest.json..."
          node generate-android-project.cjs

          echo ""
          echo "🔍 Verifying generated files..."
          for file in "build.gradle" "settings.gradle" "app/build.gradle" "app/src/main/AndroidManifest.xml"; do
            if [ ! -f "$file" ]; then
              echo "❌ ERROR: Required file missing: $file"
              exit 1
            fi
            echo "✓ Found: $file"
          done

          echo ""
          echo "⬇️  Setting up Gradle wrapper..."
          mkdir -p gradle/wrapper
          curl -L https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar

          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          curl -L https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradlew -o gradlew
          curl -L https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradlew.bat -o gradlew.bat
          chmod +x gradlew
          echo "✓ Gradle wrapper ready"

          echo ""
          echo "--------------------------------------------------------"
          echo "🌐 DIGITAL ASSET LINKS (Action Required)"
          echo "To remove 'Vivaldi' and 'Open with' prompts, host this at:"
          echo "https://albidr.github.io/.well-known/assetlinks.json"
          echo ""
          echo '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"com.albidr.clashmanager","sha256_cert_fingerprints":["'$SHA256'"]}}]'
          echo "--------------------------------------------------------"
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build APK
        run: |
          cd Frontend-PWA

          echo "🔨 Building Android APK..."
          echo "   Version Code: $(jq '.appVersionCode' twa-manifest.json)"
          echo "   Keystore: signing.keystore"
          echo ""

          ./gradlew assembleRelease --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify Build
        run: |
          cd Frontend-PWA
          echo "🔍 Searching for APK..."
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "❌ ERROR: No APK found!"
            exit 1
          fi

          echo "✅ APK built successfully!"
          # Use the filename calculated in the versioning step
          DESCRIPTIVE_NAME="${{ steps.versioning.outputs.apk_filename }}"
          mv "$APK_PATH" "app/build/outputs/apk/release/$DESCRIPTIVE_NAME"
          echo "✓ Renamed to: $DESCRIPTIVE_NAME"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clash-manager-android-${{ steps.versioning.outputs.build_tag }}
          path: Frontend-PWA/app/build/outputs/apk/release/${{ steps.versioning.outputs.apk_filename }}
          if-no-files-found: error
          compression-level: 0
