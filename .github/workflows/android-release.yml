name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        working-directory: Frontend-PWA
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: Frontend-PWA/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          # cache: "gradle" removed because src-tauri/gen/android is not committed

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "Frontend-PWA/src-tauri -> target"

      - name: Setup Keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > signing.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Auto-Version
        id: versioning
        # ... (lines remains same)
        run: |
          V_NAME="8.12.${{ github.run_number }}"
          V_CODE=$((1000 + ${{ github.run_number }}))

          BUILD_TAG="v${V_NAME}-build${V_CODE}"
          APK_FILENAME="clash-manager-${BUILD_TAG}.apk"

          # 2. Update Tauri manifest
          jq --arg name "$V_NAME" '.version = $name' \
             src-tauri/tauri.conf.json > tauri.tmp && mv tauri.tmp src-tauri/tauri.conf.json

          echo "version_code=$V_CODE" >> $GITHUB_OUTPUT
          echo "v_name=$V_NAME" >> $GITHUB_OUTPUT
          echo "build_tag=$BUILD_TAG" >> $GITHUB_OUTPUT
          echo "apk_filename=$APK_FILENAME" >> $GITHUB_OUTPUT

          echo "🚀 Build Info: $BUILD_TAG"
          echo "📝 Modified Tauri Config:"
          cat src-tauri/tauri.conf.json

      - name: Install Dependencies
        run: npm ci

      - name: Initialize & Patch Android
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT

          echo "🧹 Cleaning Android build artifacts..."
          rm -rf src-tauri/gen/android

          echo "🏗️  Initializing Android Support..."
          npx tauri android init --ci

          echo "🔧 Applying Build Fixes..."

          # 1. Apply Proguard Rules
          # Since src-tauri/gen/android is generated, we must inject our rules into the generated file.
          TARGET_PROGUARD="src-tauri/gen/android/app/proguard-rules.pro"
          SOURCE_PROGUARD="proguard-rules.pro"

          if [ -f "$SOURCE_PROGUARD" ]; then
             echo "✅ Found custom ProGuard rules. Appending to generated project..."
             echo "" >> "$TARGET_PROGUARD" # Ensure newline
             cat "$SOURCE_PROGUARD" >> "$TARGET_PROGUARD"
          else
             echo "⚠️ Custom ProGuard file not found at $SOURCE_PROGUARD"
             exit 1
          fi

            # 2. Minify & Shrink Configuration
            GRADLE_KTS="src-tauri/gen/android/app/build.gradle.kts"
            
            if [ -f "$GRADLE_KTS" ]; then
              echo "✨ Patching Gradle for maximum shrinkage..."
              # Enable shrinkResources and ensure isMinifyEnabled is true in release block
              # Note: Tauri 2 uses Kotlin DSL (.kts)
              sed -i 's/isMinifyEnabled = false/isMinifyEnabled = true/g' "$GRADLE_KTS"
              # We inject shrinkResources if it's missing or set to false
              if ! grep -q "isShrinkResources =" "$GRADLE_KTS"; then
                sed -i '/isMinifyEnabled = true/a \            isShrinkResources = true' "$GRADLE_KTS"
              else
                sed -i 's/isShrinkResources = false/isShrinkResources = true/g' "$GRADLE_KTS"
              fi
              echo "✅ Patch applied to $GRADLE_KTS"
            fi

      - name: Build Android App
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT

          # IMPORTANT: Signal Vite to use '/' base path for native build
          export VITE_IS_TAURI_BUILD=true

          echo "🔨 Building APK..."
          npx tauri android build --apk true

          echo "📁 Directory State after build:"
          find src-tauri/gen/android -name "*.apk"

      - name: Sign APK
        run: |
          echo "🔐 Signing APK manually for bulletproof reliability..."

          # Find the unsigned APK
          UNSIGNED_APK=$(find src-tauri/gen/android -name "*-unsigned.apk" | head -n 1)

          if [ -z "$UNSIGNED_APK" ] || [ ! -f "$UNSIGNED_APK" ]; then
            echo "❌ ERROR: Unsigned APK not found!"
            find src-tauri/gen/android -name "*.apk"
            exit 1
          fi

          echo "✅ Found unsigned APK: $UNSIGNED_APK"

          # Prepare paths
          SIGNED_APK="${UNSIGNED_APK%-unsigned.apk}-signed.apk"
          ALIGNED_APK="${UNSIGNED_APK%-unsigned.apk}.apk"

          # Locate build tools
          BUILD_TOOLS_PATH=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | sort -V | tail -n 1)
          APKSIGNER="$BUILD_TOOLS_PATH/apksigner"
          ZIPALIGN="$BUILD_TOOLS_PATH/zipalign"

          echo "🔧 Using build tools from: $BUILD_TOOLS_PATH"

          # Step 1: Sign the APK
          echo "📝 Signing APK..."
          "$APKSIGNER" sign \
            --ks signing.keystore \
            --ks-key-alias clash_manager_release \
            --ks-pass pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.ANDROID_KEY_PASSWORD }} \
            --out "$SIGNED_APK" \
            "$UNSIGNED_APK"

          if [ ! -f "$SIGNED_APK" ]; then
            echo "❌ Signing failed!"
            exit 1
          fi

          echo "✅ APK signed successfully"

          # Step 2: Zipalign the signed APK
          echo "📏 Zipaligning APK..."
          "$ZIPALIGN" -f -v 4 "$SIGNED_APK" "$ALIGNED_APK"

          if [ ! -f "$ALIGNED_APK" ]; then
            echo "❌ Zipalign failed!"
            exit 1
          fi

          echo "✅ APK zipaligned successfully"

          # Step 3: Verify the final APK
          echo "🔍 Verifying final APK..."
          "$APKSIGNER" verify --verbose --print-certs "$ALIGNED_APK"

          if [ $? -ne 0 ]; then
            echo "❌ Verification failed!"
            exit 1
          fi

          echo "✅ Final APK verified: $ALIGNED_APK"

          # Cleanup intermediate files
          rm -f "$SIGNED_APK"

          echo "📦 Final signed & aligned APK ready!"

      - name: Verify & Prepare APK
        run: |
          echo "🔍 Locating final signed APK..."

          # Find the signed APK (exclude unsigned)
          APK_PATH=$(find src-tauri/gen/android -name "*.apk" ! -name "*-unsigned.apk" ! -name "*-signed.apk" | head -n 1)

          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "❌ ERROR: Final APK not found!"
            echo "Available APKs:"
            find src-tauri/gen/android -name "*.apk"
            exit 1
          fi

          echo "✅ Found final APK: $APK_PATH"

          # Final verification
          BUILD_TOOLS_PATH=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | sort -V | tail -n 1)
          APKSIGNER="$BUILD_TOOLS_PATH/apksigner"

          echo "🔐 Final Signature Check..."
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"

          if [ $? -ne 0 ]; then
            echo "❌ Final verification failed!"
            exit 1
          fi

          echo "✅ APK is properly signed and verified"

          # Prepare for release
          DESCRIPTIVE_NAME="${{ steps.versioning.outputs.apk_filename }}"
          cp "$APK_PATH" "$DESCRIPTIVE_NAME"
          echo "✓ Prepared Release Artifact: $DESCRIPTIVE_NAME"

      - name: Upload Debug Artifacts
        if: always() # Always upload even if previous steps failed (to debug)
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts-${{ steps.versioning.outputs.build_tag }}
          path: |
            Frontend-PWA/src-tauri/gen/android/app/build/outputs/mapping/release/mapping.txt
            Frontend-PWA/src-tauri/gen/android/app/build/intermediates/merged_manifests/release/AndroidManifest.xml
          if-no-files-found: warn
          compression-level: 6

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clash-manager-android-${{ steps.versioning.outputs.build_tag }}
          path: Frontend-PWA/${{ steps.versioning.outputs.apk_filename }}
          if-no-files-found: error
          compression-level: 0

      - name: Build Changelog
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          configuration: |
            {
              "template": "#{{CHANGELOG}}",
              "categories": [
                {
                    "title": "## 🚀 Features",
                    "labels": ["feat", "new", "add", "feature"]
                },
                {
                    "title": "## 🐛 Fixes",
                    "labels": ["fix", "bug", "patch"]
                },
                {
                    "title": "## 💎 Refactors & Improvements",
                    "labels": ["refactor", "perf", "improve", "clean", "style"]
                },
                {
                    "title": "## 📦 Dependencies",
                    "labels": ["deps", "dependencies"]
                }
              ],
              "ignore_labels": ["ignore", "skip-changelog"],
              "sort": "run_number" 
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.build_tag }}
          name: Clash Manager ${{ steps.versioning.outputs.build_tag }}
          body: ${{ steps.build_changelog.outputs.changelog }}
          files: Frontend-PWA/${{ steps.versioning.outputs.apk_filename }}
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
