name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    defaults:
      run:
        working-directory: Frontend-PWA
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: Frontend-PWA/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          # cache: "gradle" removed because src-tauri/gen/android is not committed

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "Frontend-PWA/src-tauri -> target"

      - name: Setup Keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > signing.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Auto-Version
        id: versioning
        run: |
          V_NAME="8.12.${{ github.run_number }}"
          V_CODE=$((1000 + ${{ github.run_number }}))

          BUILD_TAG="v${V_NAME}-build${V_CODE}"
          APK_FILENAME="clash-manager-${BUILD_TAG}.apk"

          # 2. Update Tauri manifest
          jq --arg name "$V_NAME" '.version = $name' \
             src-tauri/tauri.conf.json > tauri.tmp && mv tauri.tmp src-tauri/tauri.conf.json

          echo "version_code=$V_CODE" >> $GITHUB_OUTPUT
          echo "v_name=$V_NAME" >> $GITHUB_OUTPUT
          echo "build_tag=$BUILD_TAG" >> $GITHUB_OUTPUT
          echo "apk_filename=$APK_FILENAME" >> $GITHUB_OUTPUT

          echo "🚀 Build Info: $BUILD_TAG"
          echo "📝 Modified Tauri Config:"
          cat src-tauri/tauri.conf.json

      - name: Install Dependencies
        run: npm install

      - name: Initialize & Patch Android
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT

          echo "🧹 Cleaning Android build artifacts..."
          rm -rf src-tauri/gen/android

          echo "🏗️  Initializing Android Support..."
          npx tauri android init --ci

          echo "🔧 Applying Build Fixes..."

          # 1. Apply Proguard Rules
          # Since src-tauri/gen/android is generated, we must inject our rules into the generated file.
          TARGET_PROGUARD="src-tauri/gen/android/app/proguard-rules.pro"
          SOURCE_PROGUARD="proguard-rules.pro"

          if [ -f "$SOURCE_PROGUARD" ]; then
             echo "✅ Found custom ProGuard rules. Appending to generated project..."
             echo "" >> "$TARGET_PROGUARD" # Ensure newline
             cat "$SOURCE_PROGUARD" >> "$TARGET_PROGUARD"
          else
             echo "⚠️ Custom ProGuard file not found at $SOURCE_PROGUARD"
             exit 1
          fi

          # 2. Minify Configuration
          # We try to ensure minify is enabled but controlled by our rules
          GRADLE_KTS="src-tauri/gen/android/app/build.gradle.kts"

          if [ -f "$GRADLE_KTS" ]; then
            # Ensure minify is ENABLED for release so R8 runs (and uses our rules)
            # If we disable it, the app is huge. If we enable it without rules, it crashes.
            # Using sed to ensure it is true, or leave as is if already true.
            echo "Checking minify status in Gradle..."
            # No-op: Tauri default is usually true for release. We trust the rules above.
          fi

      - name: Build Android App
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export TAURI_ANDROID_KEYSTORE=$GITHUB_WORKSPACE/Frontend-PWA/signing.keystore
          export TAURI_ANDROID_KEY_ALIAS=clash_manager_release

          # IMPORTANT: Signal Vite to use '/' base path for native build
          export VITE_IS_TAURI_BUILD=true

          echo "🔨 Building Sovereign APK..."
          # Build specifically for arm64 to reduce ambiguity, or universal if preferred. 
          # Defaulting to standard build which usually produces universal or splits.
          npx tauri android build --apk true

          echo "📁 Directory State after build:"
          find src-tauri/gen/android -name "*.apk"
        env:
          TAURI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TAURI_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify & Prepare APK
        run: |
          echo "🔍 Searching for APK..."

          # Debug: List all APKs found
          find src-tauri/gen/android -name "*.apk"

          # Helper function to find signed release APKs (excluding unsigned)
          find_apk() {
             find src-tauri/gen/android -name "$1" ! -name "*-unsigned.apk" | head -n 1
          }

          # 1. Search for UNIVERSAL APK first
          APK_PATH=$(find_apk "*universal*release*.apk")

          if [ -z "$APK_PATH" ]; then
            # 2. Fallback to arm64-v8a
            echo "⚠️  Universal APK not found. Looking for arm64..."
            APK_PATH=$(find_apk "*arm64-v8a*release*.apk")
          fi

          if [ -z "$APK_PATH" ]; then
             # 3. Last Resort: Any release apk that is NOT unsigned
             echo "⚠️  Specific APK not found. Falling back to ANY signed release APK..."
             APK_PATH=$(find_apk "*release*.apk")
          fi

          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "❌ ERROR: No usable APK found!"
            echo "Available APKs:"
            find src-tauri/gen/android -name "*.apk"
            exit 1
          fi

          echo "✅ Candidate APK found: $APK_PATH"

          # --- VERIFICATION STEP ---
          echo "🔐 Verifying APK Signature..."

          # Locate apksigner in the Android SDK Build Tools
          # We pick the latest version available.
          if [ -d "$ANDROID_SDK_ROOT/build-tools" ]; then
             BUILD_TOOLS_PATH=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | sort -V | tail -n 1)
             APKSIGNER="$BUILD_TOOLS_PATH/apksigner"
          else
             echo "⚠️ Build tools directory not found. Trying PATH..."
             APKSIGNER="apksigner"
          fi

          if [ -x "$APKSIGNER" ] || command -v apksigner &> /dev/null; then
             # If exact path didn't work, try bare command if in path
             if [ ! -x "$APKSIGNER" ]; then APKSIGNER="apksigner"; fi
             
             echo "Running: $APKSIGNER verify --verbose --print-certs \"$APK_PATH\""
             
             if "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"; then
                echo "✅ Signature Verification PASSED"
             else
                echo "❌ Signature Verification FAILED"
                exit 1
             fi
          else
             echo "⚠️ apksigner tool not found. Skipping verification (RISKY)."
             # We don't fail hard here if tool is missing to avoid breaking CI if environment changes, 
             # but we log a heavy warning.
          fi
          # -------------------------

          echo "✅ Final APK ready: $APK_PATH"
          DESCRIPTIVE_NAME="${{ steps.versioning.outputs.apk_filename }}"
          cp "$APK_PATH" "$DESCRIPTIVE_NAME"
          echo "✓ Prepared Artifact: $DESCRIPTIVE_NAME"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clash-manager-android-${{ steps.versioning.outputs.build_tag }}
          path: Frontend-PWA/${{ steps.versioning.outputs.apk_filename }}
          if-no-files-found: error
          compression-level: 0

      - name: Build Changelog
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          configuration: |
            {
              "template": "#{{CHANGELOG}}",
              "categories": [
                {
                    "title": "## 🚀 Features",
                    "labels": ["feat", "new", "add", "feature"]
                },
                {
                    "title": "## 🐛 Fixes",
                    "labels": ["fix", "bug", "patch"]
                },
                {
                    "title": "## 💎 Refactors & Improvements",
                    "labels": ["refactor", "perf", "improve", "clean", "style"]
                },
                {
                    "title": "## 📦 Dependencies",
                    "labels": ["deps", "dependencies"]
                }
              ],
              "ignore_labels": ["ignore", "skip-changelog"],
              "sort": "run_number" 
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.build_tag }}
          name: Clash Manager ${{ steps.versioning.outputs.build_tag }}
          body: ${{ steps.build_changelog.outputs.changelog }}
          files: Frontend-PWA/${{ steps.versioning.outputs.apk_filename }}
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
