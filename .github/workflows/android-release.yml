name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "./Frontend-PWA/package-lock.json"

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Dependencies
        run: |
          npm install -g @bubblewrap/cli
          cd Frontend-PWA
          npm install

      - name: Setup Keystore
        run: |
          cd Frontend-PWA
          # Decode the base64 keystore secret to the path defined in twa-manifest.json
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > signing.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Auto-Version
        id: versioning
        run: |
          cd Frontend-PWA
          CURRENT_CODE=$(jq '.appVersionCode' twa-manifest.json)
          NEW_CODE=$((CURRENT_CODE + 1))
          jq --argjson code "$NEW_CODE" '.appVersionCode = $code' twa-manifest.json > twa-manifest.tmp && mv twa-manifest.tmp twa-manifest.json
          echo "version_code=$NEW_CODE" >> $GITHUB_OUTPUT

      - name: Build APK/AAB
        run: |
          echo "🔧 Setting up Android SDK..."

          # Accept licenses and install specific build tools non-interactively
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1

          # Install Build Tools 34.0.0 and Platform 34 (Android 14) explicitly to match standard Bubblewrap defaults
          # This prevents Bubblewrap from asking to install them
          echo "⬇️ Installing Build Tools & Platforms..."
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-34" > /dev/null

          # Configure Bubblewrap non-interactively
          echo "⚙️ Configuring Bubblewrap..."
          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          EOF

          cd Frontend-PWA

          echo "📦 Building Android App..."
          # Run build. We pipe 'yes' just in case, but the pre-installation above should make it unnecessary.
          yes | bubblewrap build --skipPwaValidation
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify & Digital Asset Links
        run: |
          cd Frontend-PWA
          APK_FILE=$(find . -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "No APK found!"
            exit 1
          fi
          echo "Verifying signature of $APK_FILE"
          keytool -printcert -jarfile "$APK_FILE" | grep "SHA256:"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clash-manager-android-v${{ steps.versioning.outputs.version_code }}
          path: |
            Frontend-PWA/*.apk
            Frontend-PWA/*.aab
            Frontend-PWA/assetlinks.json
