name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@latest

      - name: Setup Keystore
        run: |
          cd Frontend-PWA
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > signing.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Auto-Version
        id: versioning
        run: |
          cd Frontend-PWA
          V_NAME="8.12.${{ github.run_number }}"
          V_CODE=$((1000 + ${{ github.run_number }}))

          BUILD_TAG="v${V_NAME}-build${V_CODE}"
          APK_FILENAME="clash-manager-${BUILD_TAG}.apk"

          # 2. Update Tauri manifest
          jq --arg name "$V_NAME" '.version = $name' \
             src-tauri/tauri.conf.json > tauri.tmp && mv tauri.tmp src-tauri/tauri.conf.json

          echo "version_code=$V_CODE" >> $GITHUB_OUTPUT
          echo "v_name=$V_NAME" >> $GITHUB_OUTPUT
          echo "build_tag=$BUILD_TAG" >> $GITHUB_OUTPUT
          echo "apk_filename=$APK_FILENAME" >> $GITHUB_OUTPUT

          echo "🚀 Build Info: $BUILD_TAG"
          echo "📝 Modified Tauri Config:"
          cat src-tauri/tauri.conf.json

      - name: Install Dependencies
        run: |
          cd Frontend-PWA
          npm install

      - name: Build Android App
        run: |
          cd Frontend-PWA
          export ANDROID_HOME=$ANDROID_SDK_ROOT

          echo "🏗️  Initializing Android Support (if needed)..."
          npx tauri android init --ci

          echo "🔨 Building Sovereign APK..."
          npx tauri android build --apk true

          echo "📁 Directory State after build:"
          find src-tauri/gen/android -name "*.apk"
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify & Prepare APK
        run: |
          cd Frontend-PWA
          echo "🔍 Searching for APK..."
          APK_PATH=$(find src-tauri/gen/android -name "*.apk" | grep "release" | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "❌ ERROR: No APK found!"
            exit 1
          fi

          echo "✅ APK built successfully!"
          DESCRIPTIVE_NAME="${{ steps.versioning.outputs.apk_filename }}"
          cp "$APK_PATH" "$DESCRIPTIVE_NAME"
          echo "✓ Prepared: $DESCRIPTIVE_NAME"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clash-manager-android-${{ steps.versioning.outputs.build_tag }}
          path: Frontend-PWA/${{ steps.versioning.outputs.apk_filename }}
          if-no-files-found: error
          compression-level: 0

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.build_tag }}
          name: Clash Manager ${{ steps.versioning.outputs.build_tag }}
          files: Frontend-PWA/${{ steps.versioning.outputs.apk_filename }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
