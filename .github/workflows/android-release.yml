name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "./Frontend-PWA/package-lock.json"

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Dependencies
        run: |
          npm install -g @bubblewrap/cli
          cd Frontend-PWA
          npm install

      - name: Setup Keystore
        run: |
          cd Frontend-PWA
          # Decode the base64 keystore secret to the path defined in twa-manifest.json
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > signing.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Auto-Version
        id: versioning
        run: |
          cd Frontend-PWA
          CURRENT_CODE=$(jq '.appVersionCode' twa-manifest.json)
          NEW_CODE=$((CURRENT_CODE + 1))
          jq --argjson code "$NEW_CODE" '.appVersionCode = $code' twa-manifest.json > twa-manifest.tmp && mv twa-manifest.tmp twa-manifest.json
          echo "version_code=$NEW_CODE" >> $GITHUB_OUTPUT

      - name: Build APK/AAB
        run: |
          echo "🔧 Debugging Environment..."
          echo "ANDROID_HOME: ${ANDROID_HOME}"
          echo "JAVA_HOME: ${JAVA_HOME}"
          
          # 1. Bubblewrap Configuration
          # Use updateConfig to ensure paths are set correctly in the tool's preferred format
          bubblewrap updateConfig --jdkPath "${JAVA_HOME}" --androidSdkPath "${ANDROID_HOME}"
          
          # 2. SDK component verification/installation
          # We check if build-tools are present; if not, we install them.
          if [ ! -d "${ANDROID_HOME}/build-tools/34.0.0" ]; then
            echo "⬇️ Installing missing build-tools..."
            yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-34" > /dev/null
          fi

          cd Frontend-PWA
          
          # 3. Doctor Check (Ensure environment is valid)
          echo "👨‍⚕️ Running Bubblewrap Doctor..."
          bubblewrap doctor
          
          # 4. Build
          echo "📦 Building Android App..."
          # Use --yes to automatically accept prompts if any remain
          bubblewrap build --skipPwaValidation --yes
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify & Digital Asset Links
        run: |
          cd Frontend-PWA
          APK_FILE=$(find . -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "No APK found!"
            exit 1
          fi
          echo "Verifying signature of $APK_FILE"
          keytool -printcert -jarfile "$APK_FILE" | grep "SHA256:"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clash-manager-android-v${{ steps.versioning.outputs.version_code }}
          path: |
            Frontend-PWA/*.apk
            Frontend-PWA/*.aab
            Frontend-PWA/assetlinks.json
