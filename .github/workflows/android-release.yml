name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    defaults:
      run:
        working-directory: Frontend-PWA
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: Frontend-PWA/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          # cache: "gradle" removed because src-tauri/gen/android is not committed

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "Frontend-PWA/src-tauri -> target"

      - name: Setup Keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > signing.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Auto-Version
        id: versioning
        run: |
          V_NAME="8.12.${{ github.run_number }}"
          V_CODE=$((1000 + ${{ github.run_number }}))

          BUILD_TAG="v${V_NAME}-build${V_CODE}"
          APK_FILENAME="clash-manager-${BUILD_TAG}.apk"

          # 2. Update Tauri manifest
          jq --arg name "$V_NAME" '.version = $name' \
             src-tauri/tauri.conf.json > tauri.tmp && mv tauri.tmp src-tauri/tauri.conf.json

          echo "version_code=$V_CODE" >> $GITHUB_OUTPUT
          echo "v_name=$V_NAME" >> $GITHUB_OUTPUT
          echo "build_tag=$BUILD_TAG" >> $GITHUB_OUTPUT
          echo "apk_filename=$APK_FILENAME" >> $GITHUB_OUTPUT

          echo "🚀 Build Info: $BUILD_TAG"
          echo "📝 Modified Tauri Config:"
          cat src-tauri/tauri.conf.json

      - name: Install Dependencies
        run: npm install

      - name: Initialize & Patch Android
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          
          echo "🧹 Cleaning Android build artifacts..."
          rm -rf src-tauri/gen/android

          echo "🏗️  Initializing Android Support..."
          npx tauri android init --ci

          echo "🔧 Applying Build Fixes..."
          
          # 1. Proguard Rules
          PROGUARD_FILE="src-tauri/gen/android/app/proguard-rules.pro"
          # Ensure directory exists just in case
          mkdir -p $(dirname $PROGUARD_FILE)
          
          if [ -f "$PROGUARD_FILE" ]; then
            echo "Appending to existing Proguard rules..."
          else
            echo "Creating Proguard rules file..."
            touch "$PROGUARD_FILE"
          fi
          
          echo "# Added by CI pipeline" >> "$PROGUARD_FILE"
          echo "-dontwarn org.tauri.internal.**" >> "$PROGUARD_FILE"
          echo "-keep class org.tauri.internal.** { *; }" >> "$PROGUARD_FILE"
          
          # 2. Minify Configuration (Detect Kotlin vs Groovy DSL)
          GRADLE_KTS="src-tauri/gen/android/app/build.gradle.kts"
          GRADLE_GROOVY="src-tauri/gen/android/app/build.gradle"
          
          if [ -f "$GRADLE_KTS" ]; then
            echo "Patching $GRADLE_KTS..."
            # Ensure minify is disabled for release (Kotlin DSL)
            sed -i 's/isMinifyEnabled = true/isMinifyEnabled = false/g' "$GRADLE_KTS"
          elif [ -f "$GRADLE_GROOVY" ]; then
             echo "Patching $GRADLE_GROOVY..."
             # Ensure minify is disabled for release (Groovy DSL)
             sed -i 's/minifyEnabled true/minifyEnabled false/g' "$GRADLE_GROOVY"
          else
             echo "⚠️ Could not find build.gradle to patch"
          fi

      - name: Build Android App
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export TAURI_ANDROID_KEYSTORE=$GITHUB_WORKSPACE/Frontend-PWA/signing.keystore
          export TAURI_ANDROID_KEY_ALIAS=clash_manager_release

          echo "🔨 Building Sovereign APK..."
          npx tauri android build --apk true

          echo "📁 Directory State after build:"
          find src-tauri/gen/android -name "*.apk"
        env:
          TAURI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TAURI_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify & Sign APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: clash_manager_release
        run: |
          echo "🔍 Searching for APK..."
          
          # Setup Build Tools
          BUILD_TOOLS_PATH="$ANDROID_SDK_ROOT/build-tools"
          # Get latest version directory
          LATEST_BUILD_TOOLS=$(ls -1 "$BUILD_TOOLS_PATH" | sort -V | tail -n 1)
          ZIPALIGN="$BUILD_TOOLS_PATH/$LATEST_BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS_PATH/$LATEST_BUILD_TOOLS/apksigner"
          
          echo "🛠️  Using build-tools: $LATEST_BUILD_TOOLS"

          # 1. Search for UNIVERSAL APK first (Highest Priority for compatibility)
          # "universal" usually indicates it contains all ABIs
          APK_PATH=$(find src-tauri/gen/android -name "*universal*release*.apk" | head -n 1)

          if [ -z "$APK_PATH" ]; then
            # 2. Fallback to arm64-v8a (Most common modern android)
            echo "⚠️  Universal APK not found. Looking for arm64..."
            APK_PATH=$(find src-tauri/gen/android -name "*arm64-v8a*release*.apk" | head -n 1)
          fi

          if [ -z "$APK_PATH" ]; then
             # 3. Last Resort: Any release apk
             echo "⚠️  Specific APK not found. Falling back to ANY release APK..."
             APK_PATH=$(find src-tauri/gen/android -name "*release*.apk" | head -n 1)
          fi
          
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "❌ ERROR: No usable APK found!"
            find src-tauri/gen/android -type f | grep "\.apk" || echo "No .apk files found"
            exit 1
          fi

          echo "📍 Selected APK: $APK_PATH"

          # Check if signed. If name contains 'unsigned', we must sign it.
          # Even if not named 'unsigned', we verify.
          
          echo "✍️  Re-signing/Aligning manually to ensure validity..."
            
          # Align (Required for release)
          echo "   Running zipalign..."
          "$ZIPALIGN" -v -f -p 4 "$APK_PATH" aligned.apk
          
          # Sign
          echo "   Running apksigner..."
          "$APKSIGNER" sign --ks signing.keystore \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --out final-signed.apk \
            aligned.apk
          
          echo "✅ Manual signing complete."
          APK_PATH="final-signed.apk"

          # Verify Signature (Sanity Check)
          echo "🔍 Verifying signature..."
          "$APKSIGNER" verify "$APK_PATH" || echo "⚠️ Warning: Signature verification failed. Device installation might fail."

          echo "✅ Final APK ready: $APK_PATH"
          DESCRIPTIVE_NAME="${{ steps.versioning.outputs.apk_filename }}"
          cp "$APK_PATH" "$DESCRIPTIVE_NAME"
          echo "✓ Prepared Artifact: $DESCRIPTIVE_NAME"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clash-manager-android-${{ steps.versioning.outputs.build_tag }}
          path: Frontend-PWA/${{ steps.versioning.outputs.apk_filename }}
          if-no-files-found: error
          compression-level: 0

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.build_tag }}
          name: Clash Manager ${{ steps.versioning.outputs.build_tag }}
          files: Frontend-PWA/${{ steps.versioning.outputs.apk_filename }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
