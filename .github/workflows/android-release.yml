name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Keystore
        run: |
          cd Frontend-PWA
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > signing.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Auto-Version
        id: versioning
        run: |
          cd Frontend-PWA
          CURRENT_CODE=$(jq '.appVersionCode' twa-manifest.json)
          NEW_CODE=$((CURRENT_CODE + 1))
          jq --argjson code "$NEW_CODE" '.appVersionCode = $code' twa-manifest.json > twa-manifest.tmp && mv twa-manifest.tmp twa-manifest.json
          echo "version_code=$NEW_CODE" >> $GITHUB_OUTPUT

      - name: Generate Android Project
        run: |
          cd Frontend-PWA

          echo "📦 Generating Android project from twa-manifest.json..."
          node generate-android-project.cjs

          echo ""
          echo "🔍 Verifying generated files..."
          for file in "build.gradle" "settings.gradle" "app/build.gradle" "app/src/main/AndroidManifest.xml"; do
            if [ ! -f "$file" ]; then
              echo "❌ ERROR: Required file missing: $file"
              exit 1
            fi
            echo "✓ Found: $file"
          done

          echo ""
          echo "⬇️  Setting up Gradle wrapper..."

          # Download gradle wrapper jar
          mkdir -p gradle/wrapper
          curl -L https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar

          # Create gradle-wrapper.properties
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          # Download gradlew scripts
          curl -L https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradlew -o gradlew
          curl -L https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradlew.bat -o gradlew.bat
          chmod +x gradlew

          echo "✓ Gradle wrapper ready"

      - name: Build APK
        run: |
          cd Frontend-PWA

          echo "🔨 Building Android APK..."
          echo "   Version Code: $(jq '.appVersionCode' twa-manifest.json)"
          echo "   Keystore: signing.keystore"
          echo ""

          ./gradlew assembleRelease --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify Build
        run: |
          cd Frontend-PWA

          echo "🔍 Searching for APK..."
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "❌ ERROR: No APK found!"
            echo "Directory contents:"
            ls -R app/build/outputs/ || echo "Build outputs directory doesn't exist"
            exit 1
          fi

          echo "✅ APK built successfully!"
          echo "   Path: $APK_PATH"
          echo "   Size: $(du -h "$APK_PATH" | cut -f1)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clash-manager-android-v${{ steps.versioning.outputs.version_code }}
          path: Frontend-PWA/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
