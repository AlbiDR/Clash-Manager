name: Reverse Sync Branches

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reverse-sync-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history

      - name: Setup Git User
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Sync Stable to Beta
        run: |
          echo "Fetching latest origin..."
          git fetch origin

          echo "Ensuring Beta branch exists..."
          if git show-ref --verify --quiet refs/remotes/origin/Beta; then
            echo "Branch 'Beta' exists. Checking out..."
            git checkout Beta
            git pull origin Beta
          else
            echo "Branch 'Beta' does not exist. Creating from Stable."
            git checkout -b Beta origin/Stable
            git push origin Beta
          fi

          echo "Merging Stable into Beta..."
          git merge origin/Stable --no-edit

          echo "Pushing Beta..."
          git push origin Beta

      - name: Sync Beta to Jules
        run: |
          echo "Ensuring Jules branch exists..."
          if git show-ref --verify --quiet refs/remotes/origin/Jules; then
            echo "Branch 'Jules' exists. Checking out..."
            git checkout Jules
            git pull origin Jules
          else
            echo "Branch 'Jules' does not exist. Creating from Beta."
            git checkout -b Jules Beta
            git push origin Jules
          fi

          echo "Merging Beta into Jules..."
          git merge Beta --no-edit

          echo "Pushing Jules..."
          git push origin Jules
