name: Deploy APK

on:
  push:
    tags:
      - "v*"
    branches:
      - "Beta"
      - "Stable"
    paths:
      - "Frontend-PWA/src-tauri/**"
      - ".github/workflows/deploy-apk.yml"
      - "!Frontend-PWA/src/**"
      - "!Frontend-PWA/public/**"
      - "!Backend-GAS/**"
      - "!**.md"
  workflow_dispatch:
    inputs:
      architecture:
        description: "Target Architecture (for test builds)"
        required: true
        default: "aarch64"
        type: choice
        options:
          - all
          - aarch64
          - armv7
          - i686
          - x86_64

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16

    defaults:
      run:
        working-directory: Frontend-PWA
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: Frontend-PWA/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            ${{
              (github.event.inputs.architecture == 'all' || startsWith(github.ref, 'refs/tags/')) && 'aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android' ||
              (github.event.inputs.architecture == 'armv7' && 'armv7-linux-androideabi') ||
              (github.event.inputs.architecture == 'i686' && 'i686-linux-android') ||
              (github.event.inputs.architecture == 'x86_64' && 'x86_64-linux-android') ||
              'aarch64-linux-android'
            }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "Frontend-PWA/src-tauri -> target"

      - name: Setup Keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > signing.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Auto-Version
        id: versioning
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e  # Exit on error

          # Find latest STABLE release (skipping automated builds)
          LATEST_TAG=$(gh release list --limit 100 --json tagName --jq '.[] | select(.tagName | contains("-build") | not) | .tagName' | head -n 1 2>/dev/null || echo "")

          if [ -z "$LATEST_TAG" ]; then
            echo "⚠️  No stable release found. Falling back to latest build tag..."
            LATEST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || echo "")
          fi

          if [ -z "$LATEST_TAG" ]; then
            # No previous release found, start fresh
            MAJOR=8
            MINOR=12
            PATCH=76
            echo "ℹ️  No previous release found. Starting at ${MAJOR}.${MINOR}.${PATCH}"
            BUMP_TYPE="initial"
          else
            echo "📦 Latest release: $LATEST_TAG"

            # Extract version from tag (handles multiple formats)
            VERSION_ONLY=$(echo "$LATEST_TAG" | sed -E 's/^v?([0-9]+\.[0-9]+\.[0-9]+).*/\1/')

            # Validate extracted version
            if ! echo "$VERSION_ONLY" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "⚠️  Warning: Could not parse version from tag '$LATEST_TAG'. Using fallback."
              MAJOR=8
              MINOR=12
              PATCH=76
              BUMP_TYPE="fallback"
            else
              # Parse semantic version
              MAJOR=$(echo "$VERSION_ONLY" | cut -d. -f1)
              MINOR=$(echo "$VERSION_ONLY" | cut -d. -f2)
              PATCH=$(echo "$VERSION_ONLY" | cut -d. -f3)

              echo "📊 Current version: ${MAJOR}.${MINOR}.${PATCH}"

              # Fetch commits since last release (both subject and body)
              COMMIT_COUNT=$(git rev-list ${LATEST_TAG}..HEAD --count 2>/dev/null || echo "0")

              if [ "$COMMIT_COUNT" -eq 0 ]; then
                echo "⚠️  No new commits since last release. Forcing PATCH bump."
                PATCH=$((PATCH + 1))
                BUMP_TYPE="forced-patch"
              else
                echo "📝 Analyzing $COMMIT_COUNT commit(s) since $LATEST_TAG..."

                # Get full commit messages (subject + body)
                COMMITS=$(git log ${LATEST_TAG}..HEAD --pretty=format:"%s%n%b" 2>/dev/null || echo "")

                # Initialize scoring system (highest score wins)
                MAJOR_SCORE=0
                MINOR_SCORE=0
                PATCH_SCORE=0

                # MAJOR: Breaking changes (weight: 100)
                MAJOR_PATTERNS='(BREAKING CHANGE:|^breaking:|^feat!:|^fix!:|\[breaking\]|^[Bb]reaking\s|^[Rr]emoves?\s|^[Dd]eletes?\s.*API|^[Cc]hanges?\s.*API|major release|version [0-9]+\.0\.0)'
                MAJOR_COUNT=$(echo "$COMMITS" | grep -ciE "$MAJOR_PATTERNS" | tr -d '\r' || echo "0")
                if [[ $MAJOR_COUNT -gt 0 ]]; then
                  MAJOR_SCORE=$((MAJOR_COUNT * 100))
                  echo "  🚨 Found $MAJOR_COUNT breaking change indicator(s) (score: $MAJOR_SCORE)"
                fi

                # MINOR: New features (weight: 10)
                MINOR_PATTERNS='(^feat(\(.+\))?:|^feature(\(.+\))?:|^add(\(.+\))?:|^new(\(.+\))?:|^[Aa]dds?\s|^[Nn]ew\s|^[Ii]ntroduces?\s|^[Ii]mplements?\s.*feature|^[Cc]reates?\s.*feature|^[Ee]nhances?\s|^[Ee]xpands?\s)'
                MINOR_COUNT=$(echo "$COMMITS" | grep -ciE "$MINOR_PATTERNS" | tr -d '\r' || echo "0")
                if [[ $MINOR_COUNT -gt 0 ]]; then
                  MINOR_SCORE=$((MINOR_COUNT * 10))
                  echo "  ✨ Found $MINOR_COUNT feature indicator(s) (score: $MINOR_SCORE)"
                fi

                # PATCH: Everything else (weight: 1)
                PATCH_SCORE=$COMMIT_COUNT
                echo "  🔧 Total commits: $COMMIT_COUNT (base score: $PATCH_SCORE)"

                # Determine bump type based on highest score
                if [[ $MAJOR_SCORE -gt 0 ]]; then
                  MAJOR=$((MAJOR + 1))
                  MINOR=0
                  PATCH=0
                  BUMP_TYPE="major"
                  echo "🚨 BREAKING CHANGE detected → MAJOR bump to ${MAJOR}.${MINOR}.${PATCH}"
                elif [[ $MINOR_SCORE -gt 0 ]]; then
                  MINOR=$((MINOR + 1))
                  PATCH=0
                  BUMP_TYPE="minor"
                  echo "✨ Feature detected → MINOR bump to ${MAJOR}.${MINOR}.${PATCH}"
                else
                  PATCH=$((PATCH + 1))
                  BUMP_TYPE="patch"
                  echo "🔧 Patch changes detected → PATCH bump to ${MAJOR}.${MINOR}.${PATCH}"
                fi
              fi
            fi
          fi

          # Generate version strings
          V_NAME="${MAJOR}.${MINOR}.${PATCH}"
          V_CODE=$(date -u +%s)

          # Validate version is not downgrading (sanity check)
          if [ -n "$VERSION_ONLY" ]; then
            MAJOR_OLD=$(echo "$VERSION_ONLY" | cut -d. -f1)
            MINOR_OLD=$(echo "$VERSION_ONLY" | cut -d. -f2)
            PATCH_OLD=$(echo "$VERSION_ONLY" | cut -d. -f3)
            OLD_NUMERIC=$((MAJOR_OLD * 1000000 + MINOR_OLD * 1000 + PATCH_OLD))
            NEW_NUMERIC=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
            if [ "$NEW_NUMERIC" -le "$OLD_NUMERIC" ]; then
              echo "⚠️  WARNING: Version would not increase! Forcing PATCH bump."
              PATCH=$((PATCH + 1))
              V_NAME="${MAJOR}.${MINOR}.${PATCH}"
            fi
          fi

          BUILD_TAG="v${V_NAME}-build${V_CODE}"
          APK_FILENAME="clash-manager-${BUILD_TAG}.apk"

          # Update Tauri manifest
          jq --arg name "$V_NAME" '.version = $name' \
             src-tauri/tauri.conf.json > tauri.tmp && mv tauri.tmp src-tauri/tauri.conf.json

          # Output for GitHub Actions
          echo "version_code=$V_CODE" >> $GITHUB_OUTPUT
          echo "v_name=$V_NAME" >> $GITHUB_OUTPUT
          echo "build_tag=$BUILD_TAG" >> $GITHUB_OUTPUT
          echo "apk_filename=$APK_FILENAME" >> $GITHUB_OUTPUT
          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT

          # Summary
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🚀 Version: $V_NAME (${BUMP_TYPE} bump)"
          echo "📦 Build Tag: $BUILD_TAG"
          echo "📅 Build Code: $V_CODE"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Install Dependencies
        run: npm install @tauri-apps/cli

      - name: Cache Android Project
        id: cache-android-gen
        uses: actions/cache@v4
        with:
          path: Frontend-PWA/src-tauri/gen/android
          key: android-gen-${{ hashFiles('Frontend-PWA/src-tauri/Cargo.toml') }}

      - name: Initialize Android Support
        if: steps.cache-android-gen.outputs.cache-hit != 'true'
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT

          echo "🧹 Ensuring clean slate for initialization..."
          rm -rf src-tauri/gen/android

          echo "🏗️  Initializing Android Support..."
          npx tauri android init --ci

      - name: Patch Android Project
        run: |
          cd Frontend-PWA/src-tauri/gen/android
          
          echo "🔧 Patching gradle.properties..."
          # Suppress Java 8 source/target deprecation warnings appearing on JDK 21
          echo "android.javaCompile.suppressSourceTargetDeprecationWarning=true" >> gradle.properties
          
          echo "🩹 Patching build.gradle.kts (Java 11 Modernization)..."
          # Modernize Java compatibility to Java 11 (better for JDK 21 environment)
          # Tauri 2.0 generates build.gradle.kts in the app folder
          find . -name "build.gradle.kts" -exec sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_11/g' {} +

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"
          cache-dependency-path: |
            Frontend-PWA/src-tauri/gen/android/**/*.gradle*
            Frontend-PWA/src-tauri/gen/android/**/gradle-wrapper.properties

      - name: Build Android App
        env:
          VITE_GAS_URL: ${{ secrets.VITE_GAS_URL }}
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT

          # Signal Vite to use root base path
          export VITE_IS_TAURI_BUILD=true

          echo "🔨 Building Release APK..."

          ARCH_ARG=""
          if [[ "${{ (github.event.inputs.architecture == 'all' || startsWith(github.ref, 'refs/tags/')) }}" == "true" ]]; then
            ARCH_ARG="" # Builds all targets defined in toolchain
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            ARCH_ARG="--target aarch64"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ARCH_ARG="--target ${{ github.event.inputs.architecture }}"
          fi

          # Standard build - Tauri manages minification safely via its own internal config
          npx tauri android build $ARCH_ARG --apk true

      - name: Sign APK
        run: |
          echo "🔐 Signing APK manually for bulletproof reliability..."

          # Find the unsigned APK
          UNSIGNED_APK=$(find src-tauri/gen/android -name "*-unsigned.apk" | head -n 1)

          if [ -z "$UNSIGNED_APK" ] || [ ! -f "$UNSIGNED_APK" ]; then
            echo "❌ ERROR: Unsigned APK not found!"
            find src-tauri/gen/android -name "*.apk"
            exit 1
          fi

          echo "✅ Found unsigned APK: $UNSIGNED_APK"

          # Prepare paths
          ALIGNED_UNSIGNED_APK="${UNSIGNED_APK%-unsigned.apk}-aligned-unsigned.apk"
          FINAL_APK="${UNSIGNED_APK%-unsigned.apk}.apk"

          # Locate build tools
          BUILD_TOOLS_PATH=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | sort -V | tail -n 1)
          APKSIGNER="$BUILD_TOOLS_PATH/apksigner"
          ZIPALIGN="$BUILD_TOOLS_PATH/zipalign"

          echo "🔧 Using build tools from: $BUILD_TOOLS_PATH"

          # Step 1: Zipalign the UNSIGNED APK first (CRITICAL: must be done BEFORE signing)
          echo "📏 Zipaligning unsigned APK..."
          "$ZIPALIGN" -f -v 4 "$UNSIGNED_APK" "$ALIGNED_UNSIGNED_APK"

          if [ ! -f "$ALIGNED_UNSIGNED_APK" ]; then
            echo "❌ Zipalign failed!"
            exit 1
          fi

          echo "✅ APK zipaligned successfully"

          # Step 2: Sign the zipaligned APK (signing must be LAST)
          echo "📝 Signing APK..."
          "$APKSIGNER" sign \
            --ks signing.keystore \
            --ks-key-alias clash_manager_release \
            --ks-pass pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            --key-pass pass:${{ secrets.ANDROID_KEY_PASSWORD }} \
            --out "$FINAL_APK" \
            "$ALIGNED_UNSIGNED_APK"

          if [ ! -f "$FINAL_APK" ]; then
            echo "❌ Signing failed!"
            exit 1
          fi

          echo "✅ APK signed successfully"

          # Step 3: Verify the final APK
          echo "🔍 Verifying final APK..."
          "$APKSIGNER" verify --verbose --print-certs "$FINAL_APK"

          if [ $? -ne 0 ]; then
            echo "❌ Verification failed!"
            exit 1
          fi

          echo "✅ Final APK verified: $FINAL_APK"

          # Cleanup intermediate files
          rm -f "$ALIGNED_UNSIGNED_APK"

          echo "📦 Final signed & aligned APK ready!"

      - name: Verify & Prepare APK
        run: |
          echo "🔍 Locating final signed APK..."

          # Find the signed APK (exclude unsigned)
          APK_PATH=$(find src-tauri/gen/android -name "*.apk" ! -name "*-unsigned.apk" ! -name "*-signed.apk" | head -n 1)

          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "❌ ERROR: Final APK not found!"
            echo "Available APKs:"
            find src-tauri/gen/android -name "*.apk"
            exit 1
          fi

          echo "✅ Found final APK: $APK_PATH"

          # Final verification
          BUILD_TOOLS_PATH=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | sort -V | tail -n 1)
          APKSIGNER="$BUILD_TOOLS_PATH/apksigner"

          echo "🔐 Final Signature Check..."
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"

          if [ $? -ne 0 ]; then
            echo "❌ Final verification failed!"
            exit 1
          fi

          echo "✅ APK is properly signed and verified"

          # Prepare for release
          DESCRIPTIVE_NAME="${{ steps.versioning.outputs.apk_filename }}"
          cp "$APK_PATH" "$DESCRIPTIVE_NAME"
          echo "✓ Prepared Release Artifact: $DESCRIPTIVE_NAME"


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clash-manager-android-${{ steps.versioning.outputs.build_tag }}
          path: Frontend-PWA/${{ steps.versioning.outputs.apk_filename }}
          if-no-files-found: error
          compression-level: 0

      - name: Generate Changelog
        id: changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Find latest STABLE release (skipping automated builds)
          LATEST_TAG=$(gh release list --limit 100 --json tagName --jq '.[] | select(.tagName | contains("-build") | not) | .tagName' | head -n 1 2>/dev/null || echo "")

          if [ -z "$LATEST_TAG" ]; then
             echo "⚠️  No stable release found. Falling back to latest build tag..."
             LATEST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || echo "")
          fi
          CURRENT_TAG="${{ steps.versioning.outputs.build_tag }}"
          BUMP_TYPE="${{ steps.versioning.outputs.bump_type }}"
          VERSION="${{ steps.versioning.outputs.v_name }}"

          # Create changelog file
          CHANGELOG_FILE="changelog.md"
          > "$CHANGELOG_FILE"  # Clear file

          if [ -z "$LATEST_TAG" ]; then
            echo "📝 First release - generating initial changelog"
            echo "## 🎉 Initial Release" >> "$CHANGELOG_FILE"
            echo "" >> "$CHANGELOG_FILE"
            echo "Welcome to the first release of **Clash Manager**!" >> "$CHANGELOG_FILE"
            echo "" >> "$CHANGELOG_FILE"
            echo "This is the initial production build with all core features implemented." >> "$CHANGELOG_FILE"
            echo "" >> "$CHANGELOG_FILE"
            echo "---" >> "$CHANGELOG_FILE"
            echo "" >> "$CHANGELOG_FILE"
            echo "**Build Information**:" >> "$CHANGELOG_FILE"
            echo "- Version: \`${{ steps.versioning.outputs.v_name }}\`" >> "$CHANGELOG_FILE"
            echo "- Build Code: \`${{ steps.versioning.outputs.version_code }}\`" >> "$CHANGELOG_FILE"
          else
            echo "📝 Generating changelog from $LATEST_TAG to $CURRENT_TAG..."

            # Fetch all commits since last release (ensure full subjects)
            COMMITS_FILE=$(mktemp)
            # Use --no-merges to keep it clean, though subject is usually short enough.
            # We use %s which is the subject. If user sees truncation, it might be GitHub's UI or shell wrapping.
            git log ${LATEST_TAG}..HEAD --no-merges --pretty=format:"%s" 2>/dev/null > "$COMMITS_FILE" || echo "" > "$COMMITS_FILE"
            COMMIT_COUNT=$(grep -c "." "$COMMITS_FILE" 2>/dev/null || echo "0")

            # Write header
            echo "## 📊 Release Summary" >> "$CHANGELOG_FILE"
            echo "" >> "$CHANGELOG_FILE"
            echo "**Version**: \`${VERSION}\` (${BUMP_TYPE} bump)  " >> "$CHANGELOG_FILE"
            echo "**Commits**: ${COMMIT_COUNT} changes since \`${LATEST_TAG}\`  " >> "$CHANGELOG_FILE"
            echo "**Build Code**: \`${{ steps.versioning.outputs.version_code }}\`" >> "$CHANGELOG_FILE"
            echo "" >> "$CHANGELOG_FILE"
            echo "---" >> "$CHANGELOG_FILE"
            echo "" >> "$CHANGELOG_FILE"

            # Helper function to add category
            add_category() {
              local title="$1"
              local pattern="$2"
              local exclude_pattern="$3"
              local temp_file=$(mktemp)

              if [ -n "$exclude_pattern" ]; then
                grep -iE "$pattern" "$COMMITS_FILE" | grep -viE "$exclude_pattern" > "$temp_file" 2>/dev/null || true
              else
                grep -iE "$pattern" "$COMMITS_FILE" > "$temp_file" 2>/dev/null || true
              fi

              if [ -s "$temp_file" ]; then
                echo "### $title" >> "$CHANGELOG_FILE"
                echo "" >> "$CHANGELOG_FILE"
                while IFS= read -r commit; do
                  echo "- $commit" >> "$CHANGELOG_FILE"
                done < "$temp_file"
                echo "" >> "$CHANGELOG_FILE"
              fi

              rm -f "$temp_file"
            }

            # Breaking Changes (highest priority, exclude from other categories)
            add_category "🚨 Breaking Changes" \
              "(^BREAKING CHANGE:|^breaking:|^feat!:|^fix!:|\[breaking\]|^[Bb]reaking\s|^[Rr]emoves?\s|^[Dd]eletes?\s.*API|^[Cc]hanges?\s.*API)" \
              ""

            # Features (exclude breaking changes)
            add_category "✨ Features & Enhancements" \
              "(^feat(\(.+\))?:|^feature(\(.+\))?:|^add(\(.+\))?:|^new(\(.+\))?:|^[Aa]dds?\s|^[Nn]ew\s|^[Ii]ntroduces?\s|^[Ii]mplements?\s.*feature|^[Cc]reates?\s.*feature|^[Ee]nhances?\s|^[Ee]xpands?\s)" \
              "(BREAKING|breaking|feat!|fix!)"

            # Bug Fixes
            add_category "🐛 Bug Fixes" \
              "(^fix(\(.+\))?:|^bug(\(.+\))?:|^bugfix(\(.+\))?:|^[Ff]ixes?\s|^[Rr]esolves?\s|^[Cc]orrects?\s)" \
              ""

            # Refactors & Code Quality
            add_category "🔧 Refactors & Code Quality" \
              "(^refactor(\(.+\))?:|^perf(\(.+\))?:|^style(\(.+\))?:|^clean(\(.+\))?:|^[Rr]efactors?\s|^[Cc]leans?\s|^[Oo]ptimizes?\s)" \
              ""

            # CI/CD & Build
            add_category "🔨 CI/CD & Build" \
              "(^ci(\(.+\))?:|^build(\(.+\))?:|^workflow(\(.+\))?:|^[Uu]pdates?\s.*workflow|^[Ii]mproves?\s.*release|^[Ii]mproves?\s.*build)" \
              ""

            # Documentation
            add_category "📝 Documentation" \
              "(^docs(\(.+\))?:|^documentation(\(.+\))?:|^[Uu]pdates?\s.*README|^[Uu]pdates?\s.*docs?)" \
              ""

            # Dependencies
            add_category "📦 Dependencies" \
              "(^deps(\(.+\))?:|^[Uu]pdates?\s.*dependen|^[Bb]umps?\s)" \
              ""

            # Collect all categorized commits
            CATEGORIZED_FILE=$(mktemp)
            grep -iE "(BREAKING|breaking|feat|feature|add|new|fix|bug|refactor|perf|style|clean|ci|build|workflow|docs|documentation|deps|[Aa]dds|[Nn]ew|[Ff]ixes|[Rr]esolves|[Cc]orrects|[Rr]efactors|[Cc]leans|[Oo]ptimizes|[Uu]pdates.*workflow|[Ii]mproves.*release|[Uu]pdates.*README|[Bb]umps)" "$COMMITS_FILE" > "$CATEGORIZED_FILE" 2>/dev/null || true

            # Other Changes (uncategorized commits)
            OTHER_FILE=$(mktemp)
            comm -23 <(sort "$COMMITS_FILE") <(sort "$CATEGORIZED_FILE") > "$OTHER_FILE" 2>/dev/null || true

            if [ -s "$OTHER_FILE" ]; then
              echo "### 🗒️ Other Changes" >> "$CHANGELOG_FILE"
              echo "" >> "$CHANGELOG_FILE"
              while IFS= read -r commit; do
                [ -n "$commit" ] && echo "- $commit" >> "$CHANGELOG_FILE"
              done < "$OTHER_FILE"
              echo "" >> "$CHANGELOG_FILE"
            fi

            # Footer
            echo "---" >> "$CHANGELOG_FILE"
            echo "" >> "$CHANGELOG_FILE"
            echo "**Full Changelog**: [\`${LATEST_TAG}...${CURRENT_TAG}\`](https://github.com/${{ github.repository }}/compare/${LATEST_TAG}...${CURRENT_TAG})" >> "$CHANGELOG_FILE"

            # Cleanup temp files
            rm -f "$COMMITS_FILE" "$CATEGORIZED_FILE" "$OTHER_FILE"
          fi

          echo "changelog_file=$CHANGELOG_FILE" >> $GITHUB_OUTPUT

          echo ""
          echo "✅ Changelog generated successfully:"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          cat "$CHANGELOG_FILE"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/Stable'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.build_tag }}
          name: Clash Manager ${{ steps.versioning.outputs.build_tag }}
          body_path: changelog.md
          files: Frontend-PWA/${{ steps.versioning.outputs.apk_filename }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
