name: Sync Jules PRs

on:
  schedule:
    # 8:00 AM CET
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# ============================================================================
# AUTOMATION ENGINE: Jules PR Synchronization
# ============================================================================
jobs:
  merge-prs:
    name: "Merge Google Jules PRs"
    runs-on: ubuntu-latest
    steps:
      # ----------------------------------------------------------------------
      # STEP 1: Environment Setup
      # ----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Jules Branch Exists and Checkout
        run: |
          git fetch origin
          if git show-ref --verify --quiet refs/remotes/origin/Jules; then
            echo "Branch 'Jules' exists. Checking out..."
            git checkout Jules
            git pull origin Jules
          else
            echo "Branch 'Jules' does not exist. Creating from current HEAD."
            git checkout -b Jules
            git push origin Jules
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ----------------------------------------------------------------------
      # STEP 2: Execution Logic (Ultra-Robust)
      # ----------------------------------------------------------------------
      - name: Run Merge Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/merge-jules-prs.js

      # ----------------------------------------------------------------------
      # STEP 3: Persistence & Documentation
      # ----------------------------------------------------------------------
      - name: Commit and Push Changelog
        run: |
          if [[ `git status --porcelain .jules/CHANGELOG.md` ]]; then
            git config --global user.name 'github-actions[bot]'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
            git add .jules/CHANGELOG.md
            git commit -m "docs: update changelog [skip ci]"
            git pull origin Jules --rebase
            git push origin Jules
          else
            echo "No changelog updates."
          fi
