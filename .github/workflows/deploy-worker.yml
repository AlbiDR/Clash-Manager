name: Deploy Worker

on:
  push:
    branches: ["Stable", "Beta"]
    paths:
      - "Backend-Worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

concurrency:
  group: worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install dependencies
        working-directory: .
        run: pnpm install

      - name: Build
        working-directory: Backend-Worker
        run: pnpm run build

      - name: Trigger Render Deployment
        if: github.ref == 'refs/heads/Beta' || github.ref == 'refs/heads/Stable'
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          else
            echo "⚠️ [SKIP] RENDER_DEPLOY_HOOK_URL secret not found. Skipping remote trigger."
          fi
