name: Programmatic Release (v10.0.0)

on:
  push:
    tags:
      - "v10.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: Frontend-PWA/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: Frontend-PWA

      - name: Build PWA
        run: pnpm run build
        working-directory: Frontend-PWA

      - name: Archive Production Build
        run: |
          cd Frontend-PWA/dist
          zip -r ../../dist.zip .
          cd ../..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "v10.0.0: Evolution — PWA-First (Deep Net v7)"
          body: |
            # Clash Manager v10.0.0 — Evolution

            This landmark release marks a major strategic pivot for Clash Manager. We are officially transitioning from legacy native application packaging (APK/Tauri) to a cutting-edge **PWA-First** architecture. This version resets the baseline to **v10.0.0**, powered by the new **Deep Net v7** intelligence core.

            ## 🚀 Strategic Pivot: PWA & WebAPK
            - **PWA-First Architecture**: Officially abandoned APK, TWA, and Tauri desktop systems in favor of high-performance web standards.
            - **WebAPK Integration**: Optimized for professional Android delivery with 100/100 Lighthouse scores.
            - **Native Experience**: Enhanced background sync, persistent notifications, and incremental badging for a native-like feel without the bloat.

            ## ⚖️ Deep Net v7 (Recruitment Engine)
            - **Hybrid Benchmarking**: A new scoring standard that balances internal clan standards (40%) with the external talent market (60%).
            - **Unified Yardstick**: Both members and recruits are now scored using the same formula, enabling true "apples-to-apples" comparison.
            - **Structural Ceiling**: Enforced a strict 100% cap on potential scores for visual clarity and intuitive "Performance vs Standard" interpretation.

            ## ✨ Automation & Performance
            - **Zero-Latency Sync**: Event-driven PR synchronization for seamless updates.
            - **Bundle Optimization**: Lazy-loaded `valibot` and reduced vendor-stable index significantly to improve FCP.
            - **UX Feedback**: Added visible progress and success feedback for manual synchronization and force updates.

            ## 📦 Changes Since v9.3.0
            - Complete deprecation of native Android (APK) and Desktop (Tauri) configurations.
            - Transition to a pure-web deployment model.
            - Advanced ETL performance tracking for War participation and historical donation trends.

            ---
            **Deployment Note**: This release requires a fresh installation of the PWA via your browser's "Add to Home Screen" prompt to benefit from the new WebAPK manifest.
          files: |
            dist.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
