name: Deploy Supabase

on:
  push:
    branches: ["Stable", "Beta"]
    paths:
      - "Backend/**"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

concurrency:
  group: supabase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Binary Stack
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          # SSOT Secret Farm: Ingesting the 20-key master string
          ROYALE_API_KEYS: ${{ secrets.ROYALE_API_KEYS }}
        run: |
          # 1. Login to the CLI
          supabase login --token "$SUPABASE_ACCESS_TOKEN"

          # 2. Sync The Key Farm (The engine for rotation)
          if [ -n "$ROYALE_API_KEYS" ]; then
            supabase secrets set --project-ref "$PROJECT_ID" ROYALE_API_KEYS="$ROYALE_API_KEYS"
          else
            echo "⚠️ [SKIP] ROYALE_API_KEYS secret not found. Skipping secret sync."
          fi

          # 3. Push Database DNA (The Migrations)
          cd Backend && supabase db push --project-ref "$PROJECT_ID"

          # 4. Deploy the Hunter (Edge Function)
          supabase functions deploy ingest-royale-data --project-ref "$PROJECT_ID"
