name: Deploy Supabase

on:
  push:
    branches: ["Stable", "Beta"]
    paths:
      - "Backend/**"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

concurrency:
  group: supabase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Pre-flight Script Validation
        # Clinical check to prevent broken scripts from blocking the heavy CLI logic.
        run: npx tsx Backend/scripts/Sync-Migrations.ts --help || exit 0 # Only checks for syntax/ReferenceErrors

      - name: Enforce IPv4 Connectivity
        # Mandatory: Force IPv4 for database connectivity. 
        # GH runners often fail to route to Supabase IPv6 endpoints in eu-west-1.
        run: |
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1

      - name: Deploy Binary Stack
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          # Mandatory for DB push; otherwise we skip gracefully.
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          # SSOT Secret Farm: Ingesting the 20-key master string
          ROYALE_API_KEYS: ${{ secrets.ROYALE_API_KEYS }}
          # Authoritative Repository Tags
          CLAN_TAG: ${{ vars.CLAN_TAG }}
          PLAYER_TAG: ${{ vars.PLAYER_TAG }}
          INTERNAL_BEARER_TOKEN: ${{ secrets.INTERNAL_BEARER_TOKEN }}
          SUPABASE_REGION: "eu-west-1"
        run: |
          # 0. Context: We work from the Backend root
          cd Backend
          
          # 1. Authoritative Linking
          if [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "[LINK] Establishing Authoritative Link..."
            supabase link --project-ref "$PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
          fi

          # 2. Sync The Configuration and Key Farm
          echo "Syncing Authoritative Repository Tags to Supabase..."
          supabase secrets set --project-ref "$PROJECT_ID" CLAN_TAG="$CLAN_TAG" PLAYER_TAG="$PLAYER_TAG"

          if [ -n "$ROYALE_API_KEYS" ]; then
            echo "Syncing ROYALE_API_KEYS..."
            supabase secrets set --project-ref "$PROJECT_ID" ROYALE_API_KEYS="$ROYALE_API_KEYS"
          fi

          # Sync Authoritative Secrets to Vault for Database-level self-awareness
          for KEY in "INTERNAL_BEARER_TOKEN" "CLAN_TAG" "PLAYER_TAG"; do
            VAL="${!KEY}"
            if [ -n "$VAL" ]; then
              echo "Syncing $KEY to Vault..."
              # Escape single quotes for PostgreSQL safety
              ESCAPED_VAL=$(echo "$VAL" | sed "s/'/''/g")
              
              supabase db query --linked "
                DO \$\$
                DECLARE
                  v_id uuid;
                BEGIN
                  SELECT id INTO v_id FROM vault.secrets WHERE name = '$KEY';
                  IF v_id IS NOT NULL THEN
                    PERFORM vault.update_secret(v_id, '$ESCAPED_VAL', '$KEY');
                  ELSE
                    PERFORM vault.create_secret('$ESCAPED_VAL', '$KEY');
                  END IF;
                END \$\$;
              "
            fi
          done

          # 3. Push Database DNA (The Migrations) - Resilient Skip
          if [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "[PUSH] Synchronizing Database DNA..."
            # Link is already established
            
            # --- CLINICAL SELF-HEALING ---
            echo "[SYNC] Running Clinical Migration Sync..."
            # Self-heal ghosts caused by manual repairs with mismatching timestamps
            npx tsx scripts/Sync-Migrations.ts || echo "[WARNING] Sync script failed. Attempting db push anyway."
            # -----------------------------

            # The Binary Stack is now consolidated. 
            # We assume a clean state based on the 20260411160000 baseline.
            supabase db push --include-all
          else
            echo "[INFO] SUPABASE_DB_PASSWORD not found. Skipping SQL migrations."
            echo "   (Note: Database DNA was manually initialized by the Assistant)."
          fi

          # 3. Deploy the Hunter (Edge Function)
          echo "[DEPLOY] Launching The Hunter (Edge Function)..."
          supabase functions deploy ingest-royale-data --project-ref "$PROJECT_ID" --no-verify-jwt
          supabase functions deploy headhunter-scanner --project-ref "$PROJECT_ID" --no-verify-jwt
          supabase functions deploy sync-player-cards --project-ref "$PROJECT_ID" --no-verify-jwt
