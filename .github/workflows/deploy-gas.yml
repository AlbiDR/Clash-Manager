name: Deploy GAS

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: ["Stable", "Beta"]
    paths:
      - "Backend-GAS/**" # Only triggers if backend files change
  workflow_dispatch: # Allows you to click "Run workflow" manually

#  CONCURRENCY: If you push 3 backend changes in a row,
# it cancels the old ones and only pushes the latest code to Google.
concurrency:
  group: gas-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-gas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install Dependencies
        run: pnpm install

      #  SECRET VALIDATION: Check for presence of required secrets
      - name: Validate Secrets
        env:
          CLASPRC: ${{ secrets.CLASPRC_JSON }}
          GAS_URL: ${{ secrets.VITE_GAS_URL }}
          SID: ${{ secrets.SCRIPT_ID }}
        run: |
          if [ -z "$CLASPRC" ]; then
            echo "::error:: CRITICAL ERROR: CLASPRC_JSON secret is missing."
            echo "Please add the 'CLASPRC_JSON' secret to your GitHub Repository Settings."
            exit 1
          fi

          if [ -z "$GAS_URL" ] && [ -z "$SID" ]; then
            echo "::error:: CRITICAL ERROR: VITE_GAS_URL secret is missing."
            echo "Please add 'VITE_GAS_URL' to your repository secrets."
            exit 1
          fi

      - name: Create Clasp Auth File
        run: |
          cat <<EOF > ~/.clasprc.json
          ${{ secrets.CLASPRC_JSON }}
          EOF

      - name: Create Clasp Project Settings
        env:
          GAS_URL: ${{ secrets.VITE_GAS_URL }}
          SID: ${{ secrets.SCRIPT_ID }}
        working-directory: Backend-GAS
        run: |
          #  INTELLIGENT ID RESOLUTION
          TARGET_ID=""

          # 1. Prefer Explicit SCRIPT_ID (Correct Project ID)
          if [ -n "$SID" ]; then
            echo " Found SCRIPT_ID secret."
            TARGET_ID="$SID"
          fi

          # 2. Fallback to VITE_GAS_URL extraction if SCRIPT_ID is missing
          if [ -z "$TARGET_ID" ] && [ -n "$GAS_URL" ]; then
            echo " [INFO] SCRIPT_ID not found. Attempting extraction from URL..."
            
            # Pattern 1: project URL (/d/<ID>/)
            if [[ "$GAS_URL" =~ /d/([a-zA-Z0-9_-]{20,}) ]]; then
              TARGET_ID="${BASH_REMATCH[1]}"
              echo " [SUCCESS] Extracted Project ID from path."
            # Pattern 2: deployment URL (/s/<ID>/)
            elif [[ "$GAS_URL" =~ /s/([a-zA-Z0-9_-]{20,}) ]]; then
              TARGET_ID="${BASH_REMATCH[1]}"
              echo " [WARNING] Extracted ID from Deployment URL. This might not be the project ID."
            else
              # Pattern 3: raw ID or unknown format
              TARGET_ID=$(echo "$GAS_URL" | sed -E 's|.*/||; s|\?.*||')
              echo " [INFO] Using tail of URL/string as ID."
            fi
          fi

          # 3. Final Validation (OCD: Zero-Trust Check)
          if [ -z "$TARGET_ID" ]; then
             echo "::error:: [CRITICAL] Failed to resolve Script ID. Ensure SCRIPT_ID is set in secrets."
             exit 1
          fi
          
          echo " Target Script ID: ${TARGET_ID:0:5}..."

          # Write config pointing to dist folder for compiled assets
          echo "{\"scriptId\":\"$TARGET_ID\",\"rootDir\":\"./dist\"}" > .clasp.json
          
          # Double check file content
          if grep -q '"scriptId":""' .clasp.json; then
             echo "::error:: .clasp.json was generated with an empty scriptId."
             exit 1
          fi

      - name: Compile and Push
        working-directory: Backend-GAS
        run: pnpm run deploy
