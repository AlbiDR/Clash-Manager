name: Deploy GAS

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: ["Stable", "Beta"]
    paths:
      - "Backend-GAS/**" # Only triggers if backend files change
  workflow_dispatch: # Allows you to click "Run workflow" manually

#  CONCURRENCY: If you push 3 backend changes in a row,
# it cancels the old ones and only pushes the latest code to Google.
concurrency:
  group: gas-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-gas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install Dependencies
        run: pnpm install

      #  SECRET VALIDATION: Check for presence of required secrets
      - name: Validate Secrets
        env:
          CLASPRC: ${{ secrets.CLASPRC_JSON }}
          GAS_URL: ${{ secrets.VITE_GAS_URL }}
          SID: ${{ secrets.SCRIPT_ID }}
        run: |
          if [ -z "$CLASPRC" ]; then
            echo "::error:: CRITICAL ERROR: CLASPRC_JSON secret is missing."
            echo "Please add the 'CLASPRC_JSON' secret to your GitHub Repository Settings."
            exit 1
          fi

          if [ -z "$GAS_URL" ] && [ -z "$SID" ]; then
            echo "::error:: CRITICAL ERROR: VITE_GAS_URL secret is missing."
            echo "Please add 'VITE_GAS_URL' to your repository secrets."
            exit 1
          fi

      - name: Install Clasp Global
        run: pnpm add -g @google/clasp

      - name: Create Clasp Auth File
        run: echo "$CLASPRC_JSON" > ~/.clasprc.json
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}

      - name: Create Clasp Project Settings
        env:
          GAS_URL: ${{ secrets.VITE_GAS_URL }}
          SID: ${{ secrets.SCRIPT_ID }}
        working-directory: Backend-GAS
        run: |
          #  INTELLIGENT ID RESOLUTION
          TARGET_ID=""

          # 1. Prefer Explicit SCRIPT_ID (Correct Project ID)
          if [ -n "$SID" ]; then
            echo " Found SCRIPT_ID secret."
            TARGET_ID="$SID"
          fi

          # 2. Fallback to VITE_GAS_URL extraction if SCRIPT_ID is missing
          if [ -z "$TARGET_ID" ] && [ -n "$GAS_URL" ]; then
            echo " SCRIPT_ID not found. Attempting to extract from VITE_GAS_URL..."
            
            if [[ "$GAS_URL" == *"script.google.com"* ]]; then
               if [[ "$GAS_URL" == *"/d/"* ]]; then
                  # Extract ID from /d/<ID>/... (Project URL)
                  TARGET_ID=$(echo "$GAS_URL" | sed -n 's|.*/d/\([^/]*\).*|\1|p')
                  echo " Extracted Project ID from URL."
               else
                  # Fallback for /s/ or /macros/s/ (Deployment URL)
                  # Warning: This is usually the Deployment ID, not the Script ID.
                  echo "::warning::Using ID from Deployment URL. This may fail if it is not the Project ID."
                  TARGET_ID=$(echo "$GAS_URL" | sed -n 's|.*/s/\([^/]*\).*|\1|p')
               fi
            else
               TARGET_ID="$GAS_URL"
               echo " Using raw VITE_GAS_URL string as ID."
            fi
          fi

          # 3. Final Validation
          if [ -z "$TARGET_ID" ]; then
             echo "::error:: Failed to resolve Script ID. Ensure SCRIPT_ID is set (preferred) or VITE_GAS_URL contains a valid ID."
             exit 1
          fi
          
          echo " Target Script ID: ${TARGET_ID:0:5}..."

          # Write config pointing to dist folder for compiled assets
          echo "{\"scriptId\":\"$TARGET_ID\",\"rootDir\":\"./dist\"}" > .clasp.json
          
          # Double check file content
          if grep -q '"scriptId":""' .clasp.json; then
             echo "::error:: .clasp.json was generated with an empty scriptId."
             exit 1
          fi

      - name: Compile and Push
        working-directory: Backend-GAS
        run: pnpm run deploy
