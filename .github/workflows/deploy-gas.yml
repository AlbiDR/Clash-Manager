name: Deploy GAS

on:
  push:
    branches: ["Stable", "Beta"]
    paths:
      - "Backend-GAS/**" # Only triggers if backend files change
  workflow_dispatch: # Allows you to click "Run workflow" manually

# ⚡ CONCURRENCY: If you push 3 backend changes in a row,
# it cancels the old ones and only pushes the latest code to Google.
concurrency:
  group: gas-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-gas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 🛡️ SECRET VALIDATION: Check for presence of required secrets
      - name: Validate Secrets
        env:
          CLASPRC: ${{ secrets.CLASPRC_JSON }}
          SID: ${{ secrets.SCRIPT_ID }}
          GAS_URL: ${{ secrets.VITE_GAS_URL }}
        run: |
          if [ -z "$CLASPRC" ]; then
            echo "::error::❌ CRITICAL ERROR: CLASPRC_JSON secret is missing."
            echo "Please add the 'CLASPRC_JSON' secret to your GitHub Repository Settings."
            exit 1
          fi

          if [ -z "$SID" ] && [ -z "$GAS_URL" ]; then
            echo "::error::❌ CRITICAL ERROR: Missing Script ID."
            echo "Please add 'SCRIPT_ID' (preferred) or 'VITE_GAS_URL' to repository secrets."
            exit 1
          fi

      # Using --no-fund and --no-audit makes the Clasp installation faster
      - name: Install Clasp
        run: pnpm add -g @google/clasp

      - name: Create Clasp Auth File
        run: echo "$CLASPRC_JSON" > ~/.clasprc.json
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}

      - name: Create Clasp Project Settings
        env:
          SID: ${{ secrets.SCRIPT_ID }}
          GAS_URL: ${{ secrets.VITE_GAS_URL }}
        run: |
          cd Backend-GAS
          
          # 🧠 INTELLIGENT ID RESOLUTION
          TARGET_ID=""

          # 1. Prefer Explicit SCRIPT_ID (Best Practice)
          if [ -n "$SID" ]; then
            echo "✅ Found SCRIPT_ID secret."
            TARGET_ID="$SID"
          fi

          # 2. Fallback to VITE_GAS_URL extraction if SCRIPT_ID is missing
          if [ -z "$TARGET_ID" ] && [ -n "$GAS_URL" ]; then
            echo "⚠️ SCRIPT_ID not found. Attempting to extract from VITE_GAS_URL..."
            if [[ "$GAS_URL" == *"script.google.com"* ]]; then
               # Extract ID between '/s/' and the next slash
               TARGET_ID=$(echo "$GAS_URL" | sed -n 's|.*/s/\([^/]*\).*|\1|p')
               echo "ℹ️ Extracted ID from URL."
            else
               # Assume raw ID if it doesn't look like a URL
               TARGET_ID="$GAS_URL"
               echo "ℹ️ Using VITE_GAS_URL as raw ID."
            fi
          fi

          # 3. Final Validation
          if [ -z "$TARGET_ID" ]; then
             echo "::error::❌ Failed to resolve Script ID. Ensure SCRIPT_ID or VITE_GAS_URL is set correctly."
             exit 1
          fi
          
          echo "🆔 Target Script ID: ${TARGET_ID:0:5}..."

          # Write config
          echo "{\"scriptId\":\"$TARGET_ID\",\"rootDir\":\".\"}" > .clasp.json
          
          # Double check file content
          if grep -q '"scriptId":""' .clasp.json; then
             echo "::error::❌ .clasp.json was generated with an empty scriptId."
             exit 1
          fi

      - name: Push Code to Google Apps Script
        run: |
          cd Backend-GAS
          clasp push --force
