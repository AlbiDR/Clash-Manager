name: Deploy GAS

on:
  push:
    branches: ["Stable", "Beta"]
    paths:
      - "Backend-GAS/**" # Only triggers if backend files change
  workflow_dispatch: # Allows you to click "Run workflow" manually

# ⚡ CONCURRENCY: If you push 3 backend changes in a row,
# it cancels the old ones and only pushes the latest code to Google.
concurrency:
  group: gas-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-gas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 🛡️ SECRET VALIDATION: Check for presence of required secrets
      - name: Validate Secrets
        env:
          SID: ${{ secrets.SCRIPT_ID }}
          URL: ${{ secrets.VITE_GAS_URL }}
          CLASPRC: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC" ]; then
            echo "::error::❌ CRITICAL ERROR: CLASPRC_JSON secret is missing."
            echo "Please add the 'CLASPRC_JSON' secret to your GitHub Repository Settings."
            exit 1
          fi

          if [ -z "$SID" ] && [ -z "$URL" ]; then
            echo "::error::❌ CRITICAL ERROR: Neither SCRIPT_ID nor VITE_GAS_URL secrets were found."
            echo "Please add the Script ID to repository secrets."
            exit 1
          fi

      # Using --no-fund and --no-audit makes the Clasp installation faster
      - name: Install Clasp
        run: pnpm add -g @google/clasp

      - name: Create Clasp Auth File
        run: echo "$CLASPRC_JSON" > ~/.clasprc.json
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}

      - name: Create Clasp Project Settings
        env:
          SID: ${{ secrets.SCRIPT_ID }}
          URL: ${{ secrets.VITE_GAS_URL }}
        run: |
          cd Backend-GAS
          
          # 🧠 INTELLIGENT ID RESOLUTION
          # 1. Prefer explicit SCRIPT_ID
          FINAL_ID="$SID"
          
          # 2. Fallback to VITE_GAS_URL if SCRIPT_ID is missing
          if [ -z "$FINAL_ID" ]; then
            echo "⚠️ SCRIPT_ID secret is empty. Attempting to resolve from VITE_GAS_URL..."
            
            # Check if it looks like a URL
            if [[ "$URL" == *"script.google.com"* ]]; then
               # Extract ID between '/s/' and '/exec' (or end of string)
               # Regex: remove everything before /s/, then remove everything after the next /
               FINAL_ID=$(echo "$URL" | sed -e 's/.*\/s\///' -e 's/\/.*//')
               echo "ℹ️ Extracted ID from URL."
            else
               # Assume the value is the ID itself
               FINAL_ID="$URL"
               echo "ℹ️ Used VITE_GAS_URL value directly."
            fi
          fi

          if [ -z "$FINAL_ID" ]; then
             echo "::error::❌ Failed to resolve Script ID. Ensure SCRIPT_ID or VITE_GAS_URL is set correctly."
             exit 1
          fi
          
          echo "✅ Target Script ID: ${FINAL_ID:0:5}..."

          # Write config
          echo "{\"scriptId\":\"$FINAL_ID\",\"rootDir\":\".\"}" > .clasp.json
          
          # Double check file content
          if grep -q '"scriptId":""' .clasp.json; then
             echo "::error::❌ .clasp.json was generated with an empty scriptId."
             exit 1
          fi

      - name: Push Code to Google Apps Script
        run: |
          cd Backend-GAS
          clasp push --force
