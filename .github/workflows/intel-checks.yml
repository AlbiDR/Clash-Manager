name: Intelligence Checks

on:
  pull_request:
    branches: [ Stable, Beta ]
  workflow_dispatch:

jobs:
  intelligence-suite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Nightly lifecycle contracts
        run: pnpm test:nightly-lifecycle

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Version & Monorepo Integrity (audit:version)
        run: pnpm audit:version

      - name: Structural Search (ast-grep)
        run: npx ast-grep scan --config .github/sgconfig.yml

      - name: Architectural Guard (dependency-cruiser)
        run: |
          npx depcruise --config .github/.dependency-cruiser.mjs Frontend-PWA/src

      - name: Lint (ESLint)
        run: |
          cd Frontend-PWA
          pnpm run lint

      - name: Dead Code Scan (knip)
        continue-on-error: true
        run: |
          pnpm knip --reporter compact 2>&1 | tee knip-report.txt
          echo "--- Knip scan complete (non-blocking) ---"

      - name: Upload Knip Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knip-report
          path: knip-report.txt
          retention-days: 14

  backend-suite:
    name: Backend Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Audit Migration Quality
        run: pnpm audit:migrations

      - name: Verify Declarative Database Baseline
        run: pnpm test:database-baseline

      - name: Verify database.types.ts is fresh (Schema Drift Guard, Phase 2)
        # Root cause this closes (2026-08-26 audit): the phantom-column check in
        # validate_project.ts (audit:version) trusts database.types.ts as the
        # authority on the live schema, but that file is only regenerated by a
        # manual step (see Backend/README.md) that's easy to forget -- it had
        # in fact gone stale for weeks, missing two views and two functions
        # added by the 2026-08-17 incident-fix migrations, before this check
        # was added. This closes that gap by comparing the committed file
        # against a fresh read of the live database on every run.
        #
        # Degrades to a warning, not a failure, when the live credentials
        # aren't available (e.g. a PR from a fork, which GitHub withholds
        # secrets from by design) rather than blocking those PRs on a check
        # they structurally cannot pass.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: |
          cd Backend

          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_ID" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_ID not available (e.g. a fork PR) -- skipping live schema freshness check."
            exit 0
          fi

          supabase gen types typescript --project-id "$PROJECT_ID" --schema substrate,drivers,features,public > /tmp/fresh-database-types.ts

          # The committed file carries an SPDX header the generator doesn't
          # produce (SPDX line, copyright line, blank line); skip exactly
          # those before comparing so that's never a false-positive diff.
          if ! diff -q <(tail -n +4 supabase/database.types.ts) /tmp/fresh-database-types.ts > /dev/null; then
            echo "::error::Backend/supabase/database.types.ts is stale relative to the live database."
            echo "Run: cd Backend && supabase gen types typescript --linked --schema substrate,drivers,features,public"
            echo "then restore the SPDX header and commit the result. Diff (committed vs. live):"
            diff <(tail -n +4 supabase/database.types.ts) /tmp/fresh-database-types.ts || true
            exit 1
          fi

          echo "database.types.ts matches the live database."

      - name: Lint Edge Functions
        run: |
          cd Backend
          supabase functions list
          # Optional: Add deno linting here if deno is installed
