name: Intelligence Checks

on:
  pull_request:
    branches: [ Beta, main ]
  workflow_dispatch:

jobs:
  intelligence-suite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Structural Search (ast-grep)
        run: npx ast-grep scan

      - name: Architectural Guard (dependency-cruiser)
        run: |
          npx depcruise --config .dependency-cruiser.js Frontend-PWA/src
          npx depcruise --config .dependency-cruiser.js Backend-GAS
