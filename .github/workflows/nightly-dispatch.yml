name: Nightly Dispatch

# Creates the Jules session for each of the 13 nightly stages directly from
# GitHub Actions, reading the stage's prompt from .github/nightly-prompts/
# and its identity from .github/nightly-config/stages.json, instead of
# relying on a per-stage scheduled task configured by hand inside the Jules
# UI. This makes the schedule and prompt content fully version-controlled
# and reviewable. It does NOT change how a session's PR gets published
# (still Jules' own AUTO_CREATE_PR automation) or how a stuck session gets
# recovered (still Nightly Watchdog) -- those are separate problems.
#
# Landed inert: manual dispatch only, no `schedule` trigger yet. Each stage
# gets its cron line added here, one at a time, only once that stage's
# manual pilot run is confirmed working end to end -- and in the same change
# that disables that stage's scheduled task in the Jules UI, so a stage is
# never triggered from both places at once.
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Stage number to dispatch (1-13)."
        required: true
      date:
        description: "UTC pipeline date to record in the ledger (YYYY-MM-DD). Defaults to today."
        required: false

concurrency:
  # Shared with Nightly Watchdog and Sync Nightly PRs: all three read and
  # write the ledger, so they must never race each other over it.
  group: nightly-control-plane
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  dispatch:
    name: "Dispatch Nightly Stage"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: Nightly

      - name: Dispatch Jules session
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          # Mask before the script can emit a single line. The repository is
          # public and this job holds the Jules key to create the session.
          if [ -n "$JULES_API_KEY" ]; then echo "::add-mask::$JULES_API_KEY"; fi

          DATE_INPUT="${{ github.event.inputs.date }}"
          if [ -n "$DATE_INPUT" ]; then
            node .github/scripts/nightly/nightly-dispatch.mjs --stage "${{ github.event.inputs.stage }}" --date "$DATE_INPUT"
          else
            node .github/scripts/nightly/nightly-dispatch.mjs --stage "${{ github.event.inputs.stage }}"
          fi

      - name: Commit and Push Ledger with Retry
        run: |
          if [[ `git status --porcelain .github/nightly-logs/nightly-run-ledger.json` ]]; then
            git config --global user.name 'github-actions[bot]'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
            git add .github/nightly-logs/nightly-run-ledger.json
            git commit -m "docs: update nightly run ledger [skip ci]"

            for i in {1..3}; do
              echo "Push attempt $i..."
              git pull origin Nightly --rebase
              if git push origin Nightly; then
                echo "Successfully pushed ledger update."
                break
              fi
              if [ $i -lt 3 ]; then
                echo "Push failed. Waiting 10 seconds..."
                sleep 10
              else
                echo "Push failed after 3 attempts."
                exit 1
              fi
            done
          else
            echo "No ledger changes to commit."
          fi
