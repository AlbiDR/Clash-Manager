name: Deploy PWA


on:
  push:
    branches: ["Stable", "Beta", "Clan-Voyage"]
    paths:
      - "Frontend-PWA/**"
      - "APK/release/**"
      - ".github/workflows/deploy-pwa.yml"
  pull_request:
    branches: ["Stable"]
    types: [opened, synchronize, reopened]
    paths:
      - "Frontend-PWA/**"
      - "APK/release/**"
  workflow_dispatch:

concurrency:
  group: pwa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

env:
  # Matches the `packageManager` field in the root package.json.
  # Pinning ensures reproducible installs and prevents accidental pnpm version
  # drift across runs. The v10/v11 layout WARN emitted by the runner shim is
  # cosmetic only; the downgrade completes successfully regardless.
  PNPM_VERSION: "10.32.1"
  CI: "true"

defaults:
  run:
    working-directory: Frontend-PWA

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Suppress Git Advice
        run: git config --global advice.defaultBranchName false
        working-directory: .

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install Dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # --------------------------------------------------------------------
      # Build-time skeleton capture (`scripts/capture_skeletons.ts`) boots a
      # Vite server plus a headless Chromium to measure the real components'
      # geometry, so skeletons never have to be hand-updated to match the UI.
      # It already content-hashes its inputs and skips the browser when nothing
      # changed, but both of its on-disk artifacts are gitignored, so CI
      # started cold on every run and paid the full capture (~35s locally, more
      # on a runner) even for a docs-only change.
      #
      # Both paths are required for a hit to be useful: `bones-cache.json`
      # holds the per-group hashes and `bones.generated.json` holds the
      # geometry itself (`readStoredBones` reads it back out of there).
      # Restoring only the former would report a hit with no measurements.
      #
      # The key comes from the capture script's OWN declared surface rather
      # than a file list copied into this YAML. A copied list is the exact
      # manual-maintenance trap the bone capture exists to remove: add a
      # capture group, forget to update the copy, and CI serves stale geometry
      # for it indefinitely. With one list there is nothing to keep in step.
      # --------------------------------------------------------------------
      - name: Resolve Skeleton Capture Surface
        id: bones-key
        run: |
          echo "hash=$(pnpm exec tsx scripts/capture_skeletons.ts --print-hash)" >> "$GITHUB_OUTPUT"

      - name: Cache Skeleton Capture
        id: bones-cache
        uses: actions/cache@v4
        with:
          path: |
            Frontend-PWA/.cache/bones-cache.json
            Frontend-PWA/src/core/theme/bones.generated.json
          key: bones-${{ runner.os }}-${{ steps.bones-key.outputs.hash }}

      # Chromium is only ever booted by a stale capture group. On a cache hit
      # the capture short-circuits before touching Playwright, so installing
      # the browser is pure dead weight (~12s plus the download).
      - name: Install Playwright Chromium
        if: steps.bones-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Project Validation
        working-directory: .
        run: |
          if [ -f .github/scripts/project/validate-project.ts ]; then
            pnpm exec tsx .github/scripts/project/validate-project.ts
          else
            echo "Validation script not found."
          fi

      - name: Run Tests
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_PLAYER_TAG: ${{ vars.PLAYER_TAG }}
        run: pnpm test

      - name: Build Project
        env:
          # This is the build that gets uploaded to Pages, so its skeleton
          # geometry is the geometry users receive. Refuse to publish stale or
          # fallback bones rather than degrade silently. Auto Tag deliberately
          # does NOT set this: it builds only as a pre-tag gate, installs no
          # Chromium, and discards the output.
          BONES_REQUIRE_CAPTURE: "true"
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_PLAYER_TAG: ${{ vars.PLAYER_TAG }}
        run: pnpm run build

      - name: Publish APK release assets with PWA
        run: |
          mkdir -p dist/apk/release
          cp ../APK/release/latest.json dist/apk/release/latest.json
          APK_FILENAME="$(node -e "console.log(require('../APK/release/latest.json').filename)")"
          cp "../APK/release/${APK_FILENAME}" "dist/apk/release/${APK_FILENAME}"

      - name: List Dist Contents
        run: ls -R ./dist

      - name: Upload Pages Artifact
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/Stable' || github.ref == 'refs/heads/Beta' || github.ref == 'refs/heads/Clan-Voyage')) || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "${{ github.workspace }}/Frontend-PWA/dist"

  deploy:
    name: Deploy
    needs: build
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/Stable' || github.ref == 'refs/heads/Beta' || github.ref == 'refs/heads/Clan-Voyage')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
