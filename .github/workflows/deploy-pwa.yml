name: Deploy PWA

on:
  push:
    branches: ["Stable", "Beta"]
    paths:
      - "Frontend-PWA/**"
      - ".github/workflows/deploy-pwa.yml"
  pull_request:
    branches: ["Stable"]
    types: [opened, synchronize, reopened]
    paths:
      - "Frontend-PWA/**"
  workflow_dispatch:

concurrency:
  group: pwa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

defaults:
  run:
    working-directory: Frontend-PWA

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_GAS_URL: ${{ secrets.VITE_GAS_URL }}
    steps:
      - name: Suppress Git Advice
        run: git config --global advice.defaultBranchName false
        working-directory: .

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "Frontend-PWA/pnpm-lock.yaml"

      - name: Project Validation
        working-directory: .
        run: |
          if [ -f .github/scripts/validate_project.ts ]; then
            npx tsx .github/scripts/validate_project.ts
          else
            echo "⚠️ Validation script not found."
          fi

      - name: Install Dependencies
        run: pnpm install

      - name: Run Tests
        run: pnpm test

      - name: Build Project
        run: pnpm run build
        # env: VITE_GAS_URL is now global to the job

      - name: Upload Pages Artifact
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/Stable' || github.ref == 'refs/heads/Beta')) || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./Frontend-PWA/dist"

  deploy:
    name: Deploy
    needs: build
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/Stable' || github.ref == 'refs/heads/Beta')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
