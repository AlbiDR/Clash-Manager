name: Deploy PWA

on:
  push:
    branches: ["Stable", "Beta"]
    paths:
      - "Frontend-PWA/**"
      - ".github/workflows/deploy-pwa.yml"
  pull_request:
    branches: ["Stable"]
    types: [opened, synchronize, reopened]
    paths:
      - "Frontend-PWA/**"
  workflow_dispatch:

concurrency:
  group: pwa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

defaults:
  run:
    working-directory: Frontend-PWA

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: "Frontend-PWA/pnpm-lock.yaml"

      - name: Install Dependencies
        run: pnpm install

      - name: Run Tests
        run: pnpm test

      - name: Project Validation
        working-directory: .
        run: |
          if [ -f scripts/validate_project.js ]; then
            node scripts/validate_project.js
          else
            echo "⚠️ Validation script not found."
          fi

  deploy:
    name: Deploy
    needs: verify
    if: github.event_name == 'push' && (github.ref == 'refs/heads/Stable' || github.ref == 'refs/heads/Beta')
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: "Frontend-PWA/pnpm-lock.yaml"

      - name: Install & Build
        run: |
          pnpm install
          pnpm run build
        env:
          VITE_GAS_URL: ${{ secrets.VITE_GAS_URL }}

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./Frontend-PWA/dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
