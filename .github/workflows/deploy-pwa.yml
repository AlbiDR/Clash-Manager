name: Deploy PWA


on:
  push:
    branches: ["Stable", "Beta", "Clan-Voyage"]
    paths:
      - "Frontend-PWA/**"
      - "APK/release/**"
      - ".github/workflows/deploy-pwa.yml"
  pull_request:
    branches: ["Stable"]
    types: [opened, synchronize, reopened]
    paths:
      - "Frontend-PWA/**"
      - "APK/release/**"
  workflow_dispatch:

concurrency:
  group: pwa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

env:
  # Matches the `packageManager` field in the root package.json.
  # Pinning ensures reproducible installs and prevents accidental pnpm version
  # drift across runs. The v10/v11 layout WARN emitted by the runner shim is
  # cosmetic only; the downgrade completes successfully regardless.
  PNPM_VERSION: "10.32.1"
  CI: "true"

defaults:
  run:
    working-directory: Frontend-PWA

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Suppress Git Advice
        run: git config --global advice.defaultBranchName false
        working-directory: .

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install Dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Project Validation
        working-directory: .
        run: |
          if [ -f .github/scripts/validate_project.ts ]; then
            pnpm exec tsx .github/scripts/validate_project.ts
          else
            echo "Validation script not found."
          fi

      - name: Run Tests
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_PLAYER_TAG: ${{ vars.PLAYER_TAG }}
        run: pnpm test

      - name: Build Project
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_PLAYER_TAG: ${{ vars.PLAYER_TAG }}
        run: pnpm run build

      - name: Publish APK release assets with PWA
        run: |
          mkdir -p dist/apk/release
          cp ../APK/release/latest.json dist/apk/release/latest.json
          APK_FILENAME="$(node -e "console.log(require('../APK/release/latest.json').filename)")"
          cp "../APK/release/${APK_FILENAME}" "dist/apk/release/${APK_FILENAME}"

      - name: List Dist Contents
        run: ls -R ./dist

      - name: Upload Pages Artifact
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/Stable' || github.ref == 'refs/heads/Beta' || github.ref == 'refs/heads/Clan-Voyage')) || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "${{ github.workspace }}/Frontend-PWA/dist"

  deploy:
    name: Deploy
    needs: build
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/Stable' || github.ref == 'refs/heads/Beta' || github.ref == 'refs/heads/Clan-Voyage')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
