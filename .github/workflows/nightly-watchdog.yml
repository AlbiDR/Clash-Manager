name: Nightly Watchdog

on:
  schedule:
    # 3:00 PM CEST (1:00 PM UTC): post-window observer after Stage 13 and merge safety-net.
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "UTC pipeline date to inspect (YYYY-MM-DD). Defaults to today."
        required: false

concurrency:
  group: nightly-watchdog
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read
  issues: write
  actions: write

jobs:
  watchdog:
    name: "Observe Nightly Control Plane"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: Nightly

      - name: Run Nightly Watchdog
        id: watchdog
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE_INPUT="${{ github.event.inputs.date }}"
          if [ -n "$DATE_INPUT" ]; then
            node .github/scripts/nightly-watchdog.mjs --date "$DATE_INPUT"
          else
            node .github/scripts/nightly-watchdog.mjs
          fi

      - name: Commit and Push Ledger with Retry
        run: |
          if [[ `git status --porcelain .github/nightly-logs/nightly-run-ledger.json` ]]; then
            git config --global user.name 'github-actions[bot]'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
            git add .github/nightly-logs/nightly-run-ledger.json
            git commit -m "docs: update nightly run ledger [skip ci]"

            for i in {1..3}; do
              echo "Push attempt $i..."
              git pull origin Nightly --rebase
              if git push origin Nightly; then
                echo "Successfully pushed nightly run ledger."
                break
              fi
              if [ $i -lt 3 ]; then
                echo "Push failed. Waiting 10 seconds..."
                sleep 10
              else
                echo "Push failed after 3 attempts."
                exit 1
              fi
            done
          else
            echo "Nightly run ledger is unchanged."
          fi

      - name: Fail if Watchdog Detected Unresolved Stages
        if: steps.watchdog.outcome == 'failure'
        run: exit 1
