name: Nightly Watchdog

on:
  schedule:
    # Hourly early observer during the stage window. It is quiet when stages are
    # still running, but rescues completed Jules sessions whose native publisher
    # did not open a PR promptly.
    - cron: "35 0-12 * * *"
    # 3:00 PM CEST (1:00 PM UTC): post-window observer after Stage 13 and merge
    # safety-net. This pass, and only this pass, runs with --final: it is the
    # run's terminal judgement. Every earlier pass leaves stages the pipeline
    # has not reached yet as EXPECTED rather than guessing they failed (see
    # runFrontier), and stage 13 has no later stage to prove it was reached, so
    # without an explicit end-of-run signal it could never be held to account.
    - cron: "0 13 * * *"
  pull_request:
    # Reactive pass. Every Jules stage PR landing on Nightly is itself evidence
    # that the stages before it either published too or are stuck, so there is
    # no reason to wait for the fixed 13:00 UTC pass to find out. This mirrors
    # Sync Nightly PRs' own trigger exactly (same events, same base branch);
    # the shared nightly-control-plane concurrency group below queues this run
    # behind that workflow's merge pass instead of racing it. The script does
    # not need to know which PR triggered it: it re-evaluates all 13 stages for
    # today and nudges whichever ones are JULES_SESSION_STUCK, in stage order.
    types: [opened, reopened, ready_for_review, synchronize]
    branches:
      - Nightly
  workflow_dispatch:
    inputs:
      date:
        description: "UTC pipeline date to inspect (YYYY-MM-DD). Defaults to today."
        required: false

concurrency:
  # Shared with Sync Nightly PRs. The watchdog's last action is dispatching
  # that workflow, so it must never run concurrently with a merge pass already
  # in flight, and vice versa: a merge run must not touch the ledger or the
  # PRs the watchdog is still observing. The watchdog releases the lock before
  # its dispatch resolves, so a queued merge run is a delay, never a deadlock.
  group: nightly-control-plane
  cancel-in-progress: false

# issues:write is deliberately absent. Issues are disabled on this repository
# (has_issues is false), so an issue-based alarm can never fire; the step
# summary and the exit code carry the signal instead.
# actions:write is required: the recovery pass dispatches Sync Nightly PRs after
# nudging a stranded Jules session back into publishing.
permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  watchdog:
    name: "Observe and Recover Nightly Control Plane"
    runs-on: ubuntu-latest
    # The recovery pass nudges stuck Jules sessions and then polls up to 8
    # minutes for the publisher to open their pull requests.
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: Nightly

      - name: Check control-plane deployment alignment
        # Non-blocking by design: this must never prevent the observe/recover
        # pass below from running, even when it finds drift. It exists to make
        # drift visible instead of silent. A step that goes red here is the
        # signal that a fix landed on Beta only and has not actually reached
        # Nightly and Stable, the failure mode that stranded the recovery-pass
        # fix for a full day on 2026-08-16/17.
        continue-on-error: true
        run: node .github/scripts/nightly/nightly-deploy-check.mjs

      - name: Run Nightly Watchdog
        id: watchdog
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          # Mask before the script can emit a single line. The repository is
          # public and this job deliberately holds the Jules key so it can
          # resume stranded sessions.
          if [ -n "$JULES_API_KEY" ]; then echo "::add-mask::$JULES_API_KEY"; fi

          DATE_INPUT="${{ github.event.inputs.date }}"
          SCHEDULE="${{ github.event.schedule }}"

          # Terminal judgement, deliberately narrow. The post-window cron is
          # the declared end of the run window. An explicit date input is the
          # same declaration made by hand: asking about a named date is asking
          # about a run that is over, and without --final a re-inspection of an
          # old date would rewrite a recorded stage-13 failure as EXPECTED.
          # Unquoted on purpose: quoted, an empty value becomes an empty
          # argument and parseArgs rejects it.
          FINAL=""
          if [ "$SCHEDULE" = "0 13 * * *" ] || [ -n "$DATE_INPUT" ]; then
            FINAL="--final"
          fi

          set +e
          if [ -n "$DATE_INPUT" ]; then
            node .github/scripts/nightly/nightly-watchdog.mjs --date "$DATE_INPUT" $FINAL
          else
            node .github/scripts/nightly/nightly-watchdog.mjs $FINAL
          fi
          WATCHDOG_EXIT=$?
          set -e
          echo "exit_code=$WATCHDOG_EXIT" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit and Push Ledger with Retry
        run: |
          if [[ `git status --porcelain .github/nightly-logs/nightly-run-ledger.json` ]]; then
            git config --global user.name 'github-actions[bot]'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
            git add .github/nightly-logs/nightly-run-ledger.json
            git commit -m "docs: update nightly run ledger [skip ci]"

            for i in {1..3}; do
              echo "Push attempt $i..."
              git pull origin Nightly --rebase
              if git push origin Nightly; then
                echo "Successfully pushed nightly run ledger."
                break
              fi
              if [ $i -lt 3 ]; then
                echo "Push failed. Waiting 10 seconds..."
                sleep 10
              else
                echo "Push failed after 3 attempts."
                exit 1
              fi
            done
          else
            echo "Nightly run ledger is unchanged."
          fi

      # Exit-code separation. Previously every one of these conditions produced
      # the same bare `exit 1`, so the workflow was red on 100 percent of its
      # runs and the conclusion carried no information.
      - name: Report Unresolved Stages (non-blocking)
        if: steps.watchdog.outputs.exit_code == '2'
        run: |
          echo "::warning title=Nightly stages unresolved::The observer ran cleanly but some stages are unresolved or promotion has stalled. See the job summary."

      # Exit 3 is the capability-loss channel: the observer ran fine and every
      # stage may have merged, but the pipeline has lost the ability to recover
      # or is carrying a stage every night. Both are true at every pass of the
      # night rather than transiently, so reddening them costs no alarm fatigue
      # and is the only thing that would tell us the streak had ended.
      - name: Fail on Lost Pipeline Capability
        if: steps.watchdog.outputs.exit_code == '3'
        run: |
          echo "::error title=Nightly capability lost::Recovery is disarmed (dead JULES_API_KEY) or a stage is chronically carried. See the job summary."
          exit 1

      - name: Fail Only on Observer or Environment Failure
        if: steps.watchdog.outputs.exit_code != '0' && steps.watchdog.outputs.exit_code != '2' && steps.watchdog.outputs.exit_code != '3'
        run: |
          echo "Watchdog exited ${{ steps.watchdog.outputs.exit_code }}: the observer itself failed."
          exit 1
